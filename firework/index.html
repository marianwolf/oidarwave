<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistischer Feuerwerk-Generator V24.1 (Intensive Show)</title>
    <!-- Tone.js für die Audio-Effekte -->
    <script src="https://cdn.jsdelivr.net/npm/tone@14.9.15/build/Tone.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden; 
            background: radial-gradient(ellipse at bottom, #0a111a 0%, #000 100%);
            font-family: 'Inter', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Sterne zur optischen Verbesserung */
        body::before {
            content: '';
            position: fixed; 
            top: 0;
            left: 0;
            width: 1px; 
            height: 1px;
            background: transparent;
            z-index: -1; 
            box-shadow: 
                10vw 10vh #fff, 20vw 30vh #fff, 40vw 5vh #fff, 60vw 25vh #fff, 80vw 45vh #fff, 100vw 5vh #fff,
                1vw 55vh #fff, 25vw 70vh #fff, 45vw 90vh #fff, 65vw 10vh #fff, 85vw 30vh #fff, 95vw 70vh #fff,
                5vw 15vh #fff, 35vw 50vh #fff, 75vw 80vh #fff, 95vw 95vh #fff, 15vw 85vh #fff, 55vw 5vh #fff,
                1vw 1vh 1px 1px #aed9e0, 5vw 70vh 1px 1px #aed9e0, 20vw 2vh 1px 1px #aed9e0, 50vw 85vh 1px 1px #aed9e0, 
                75vw 15vh 1px 1px #aed9e0, 95vw 60vh 1px 1px #aed9e0, 80vw 10vh 1px 1px #aed9e0, 
                30vw 90vh 1px 1px #aed9e0, 10vw 80vh 1px 1px #aed9e0, 5vw 5vh 1px 1px #aed9e0;
        }
        
        canvas {
            display: block;
            touch-action: none; 
        }

        #info-overlay {
            position: absolute;
            top: 20px;
            text-align: center;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(174, 217, 224, 0.4);
            z-index: 10;
            user-select: none;
            font-size: 1.1rem;
            color: #aed9e0;
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 20;
        }

        .action-button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #4CAF50, #2E8B57);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(46, 139, 87, 0.6);
            transition: all 0.2s ease-in-out;
        }
        
        .action-button:nth-child(2) { /* Manual Launch Button */
            background: linear-gradient(135deg, #1E90FF, #4682B4);
            box-shadow: 0 4px 15px rgba(30, 144, 255, 0.6);
        }

        .action-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 139, 87, 0.8);
        }

        .action-button:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(46, 139, 87, 0.6);
        }

        .action-button:disabled {
            background: #444;
            cursor: not-allowed;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            #controls {
                flex-direction: column;
                gap: 10px;
            }
            #info-overlay {
                top: 10px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div id="info-overlay">
        Klicken Sie auf den Himmel, um **manuelle** Feuerwerke zu starten. (Audio wird beim ersten Klick aktiviert.)
        <br>Die Explosion erfolgt in der Nähe des Klicks (Startwinkel von 10° wird beibehalten).
    </div>

    <div id="controls">
        <button id="show-button" class="action-button">Show starten (45 Sekunden)</button>
        <button id="manual-type-button" class="action-button">Typ: PEONY (Klick zum Wechsel)</button>
    </div>

    <script>
        
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        const showButton = document.getElementById('show-button');
        const manualTypeButton = document.getElementById('manual-type-button');

        let isShowRunning = false;
        let showStartTime = 0;
        let showSequence = [];
        let nextRandomLaunchTime = 0;
        let audioContextStarted = false;
        let boomSynth, kickSynth, whistleSynth, crackleSynth; 
        let lastBoomTime = 0; 
        let lastWhistleTime = 0; 
        let fireworks = [];
        let particles = [];
        const GRAVITY = 0.08;      
        const AIR_RESISTANCE = 0.985; 
        const WIND = 0.005;        
        const MAX_SHELL_DEPTH = 3; 
        // Dauer der Show auf 45 Sekunden angepasst, um die Intensität des Videos widerzuspiegeln
        const SHOW_DURATION_MS = 45000;
        
        const EXPLOSION_TYPES = ['peony', 'chrysanthemum', 'ring', 'multi_shell', 'strobe', 'strobe_fast', 'crackle', 'willow', 'fish', 'wide_fan', 'looping_path', 'fountain', 'heart_shape', 'spiral', 'color_shift'];

        let currentManualTypeIndex = 0;
        let currentManualType = EXPLOSION_TYPES[currentManualTypeIndex];


        function randomRange(min, max) { return Math.random() * (max - min) + min; }
        function randomChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        
        /**
         * Erzeugt eine zufällige HSL-Farbe.
         * @param {number} hue - Optional: Fester Farbton (0-360).
         * @param {number} mixHue - Optional: Farbton, mit dem gemischt werden soll, für weichere Farbübergänge.
         * @returns {{hue: number, saturation: number, lightness: number, hsl: string}} 
         */
        function getColorData(hue, mixHue) {
            let h = hue !== undefined ? hue : randomRange(0, 360);
            
            if (mixHue !== undefined) {
                h = (h * 0.7 + mixHue * 0.3) % 360; 
            }

            const s = randomRange(90, 100);
            const l = randomRange(60, 80);
            return { hue: h, saturation: s, lightness: l, hsl: `hsl(${h}, ${s}%, ${l}%)` };
        }
        
        // Wechselt den manuellen Explosionstyp
        function changeManualType() {
            currentManualTypeIndex = (currentManualTypeIndex + 1) % EXPLOSION_TYPES.length;
            currentManualType = EXPLOSION_TYPES[currentManualTypeIndex];
            const typeName = currentManualType.replace(/_/g, ' ').toUpperCase();
            manualTypeButton.textContent = `Typ: ${typeName} (Klick zum Wechsel})`;
        }


        // --- Audio Funktionen ---

        function startAudio() {
            if (audioContextStarted) return;
            Tone.start().then(() => {
                boomSynth = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.2, sustain: 0.0, release: 0.05 }}).toDestination();
                kickSynth = new Tone.MembraneSynth({ envelope: { attack: 0.001, decay: 0.4, sustain: 0.001 }}).toDestination();
                whistleSynth = new Tone.MonoSynth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.005, decay: 0.8, sustain: 0.0, release: 0.1 },
                    filterEnvelope: { attack: 0.005, decay: 0.5, sustain: 0, release: 0.1, baseFrequency: 500, octaves: 5, exponent: 2}
                }).toDestination();
                crackleSynth = new Tone.NoiseSynth({
                    noise: { type: 'pink' },
                    envelope: { attack: 0.001, decay: 0.05, sustain: 0.0, release: 0.01 }
                }).toDestination();
                audioContextStarted = true;
            }).catch(e => console.error("Tone.js Startfehler:", e));
        }

        function playBoom() {
            if (audioContextStarted && boomSynth && kickSynth) {
                let now = Tone.now();
                const baseTime = Math.max(now + 0.002, lastBoomTime + 0.0001); 
                lastBoomTime = baseTime;
                boomSynth.triggerAttackRelease(0.2, baseTime, 0.7); 
                kickSynth.triggerAttackRelease("C1", 0.5, baseTime + 0.000001, 1); 
            }
        }

        function playWhistle(duration = 0.5) {
            if (audioContextStarted && whistleSynth) {
                let now = Tone.now();
                const startTime = Math.max(now + 0.002, lastWhistleTime + 0.01); 
                lastWhistleTime = startTime; 
                whistleSynth.triggerAttackRelease("C6", duration, startTime); 
                whistleSynth.frequency.linearRampToValueAtTime("C2", startTime + duration); 
            }
        }
        
        // Fix: Fügt minimalen Zeitversatz hinzu, um den Audiofehler zu vermeiden
        function playCrackle(duration = 0.05) {
             if (audioContextStarted && crackleSynth) {
                const time = Tone.now() + 0.001; 
                crackleSynth.triggerAttackRelease(duration, time, 0.1); 
            }
        }


        // --- Partikel Klassen ---

        class Particle {
            /**
             * @param {number} x
             * @param {number} y
             * @param {number} initialHue - Start-Farbton
             * @param {number} speed
             * @param {number} angle
             * @param {string} type - Explosionstyp (z.B. 'crackle', 'strobe', 'color_shift')
             * @param {number} [shiftHue] - Optional: Der Farbton, zu dem gewechselt werden soll.
             */
            constructor(x, y, initialHue, speed, angle, type = 'peony', shiftHue) { 
                this.x = x;
                this.y = y;
                this.initialHue = initialHue;
                this.shiftHue = shiftHue;
                this.color = getColorData(initialHue).hsl; // Aktuelle Farbe als HSL-String
                this.size = type === 'crackle' ? randomRange(0.5, 1.5) : randomRange(1.5, 3.5); 
                this.velX = Math.cos(angle) * speed;
                this.velY = Math.sin(angle) * speed;
                this.alpha = 1; 
                this.friction = AIR_RESISTANCE;
                this.decay = type === 'crackle' ? randomRange(0.025, 0.05) : randomRange(0.01, 0.02); 
                this.isStrobe = type.includes('strobe');
                this.isCrackle = type === 'crackle';
                this.isFish = type === 'fish'; 
                this.isColorShift = type === 'color_shift' && shiftHue !== undefined;

                this.strobeTick = 0; 
                this.strobeSpeed = type === 'strobe' ? 8 : (type === 'strobe_fast' ? 2 : 4);

                this.shiftThreshold = randomRange(0.4, 0.6); // Bei welcher alpha der Farbwechsel stattfindet
            }

            update() {
                this.velX *= this.friction * 0.99; 
                this.velY *= this.friction;

                this.velY += GRAVITY;
                this.velX += WIND;

                if (this.isFish) {
                    this.velX += randomRange(-0.2, 0.2); 
                    this.velY += randomRange(-0.2, 0.2);
                    const maxFishSpeed = 3;
                    const currentSpeed = Math.sqrt(this.velX * this.velX + this.velY * this.velY);
                    if (currentSpeed > maxFishSpeed) {
                        this.velX *= (maxFishSpeed / currentSpeed);
                        this.velY *= (maxFishSpeed / currentSpeed);
                    }
                }

                this.x += this.velX;
                this.y += this.velY;
                
                // --- Dynamisches Fading und Farbwechsel-Logik ---

                if (this.isStrobe) {
                    this.strobeTick++;
                    this.alpha = (this.strobeTick % this.strobeSpeed < (this.strobeSpeed / 2)) ? 1 : 0.2;
                    this.decay = 0.0015; 
                } else {
                    this.alpha -= this.decay;
                }
                
                // Realistisches Fading: Farbwechsel während des Verglühens
                const fadeProgress = 1 - this.alpha;
                
                let currentHue = this.initialHue;
                let currentSaturation = randomRange(90, 100);
                let currentLightness = randomRange(60, 80);

                // Farbwechsel-Granate: Wechselt die Farbe abrupt bei einem bestimmten Alpha-Wert
                if (this.isColorShift && this.alpha <= this.shiftThreshold) {
                    currentHue = this.shiftHue;
                }
                
                // Generelles Burn-Out: Verändere die Farbe zu Rot/Orange, wenn alpha niedrig ist
                if (fadeProgress > 0.6) { 
                    const redShift = (fadeProgress - 0.6) / 0.4; 
                    currentHue = (currentHue * (1 - redShift) + randomRange(0, 30) * redShift) % 360;
                    currentLightness = Math.max(currentLightness * (1 - redShift * 0.5), 30); 
                    currentSaturation = Math.max(currentSaturation * (1 - redShift * 0.2), 60);
                }


                // Crackle-Sound und Optik
                if (this.isCrackle && this.alpha > 0 && Math.random() < 0.1) {
                    if (this.alpha < 0.7) { 
                        playCrackle();
                        this.alpha = 0; 
                    }
                }

                this.color = `hsl(${currentHue}, ${currentSaturation}%, ${currentLightness}%)`;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = this.size * 2.5; 
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }
        
        class SparkParticle extends Particle {
            constructor(x, y, colorHue, velX, velY) {
                super(x, y, colorHue, 0, 0, 'spark'); 
                this.size = randomRange(0.5, 1.5); 
                this.decay = randomRange(0.05, 0.1); 
                this.friction = 0.95; 
                this.velX = velX * randomRange(0.1, 0.2) + randomRange(-0.5, 0.5); 
                this.velY = velY * randomRange(0.1, 0.2) + randomRange(-0.5, 0.5);
            }
            
            update() {
                this.velX *= this.friction; 
                this.velY *= this.friction;
                this.velY += GRAVITY * 0.2; 
                this.velX += WIND * 0.1;
                this.x += this.velX;
                this.y += this.velY;
                this.alpha -= this.decay;
                
                // Spark-Fading: Wird schneller rot
                const fadeProgress = 1 - this.alpha;
                let currentHue = this.initialHue;
                let currentLightness = randomRange(60, 80);

                if (fadeProgress > 0.3) { 
                    const redShift = (fadeProgress - 0.3) / 0.7; 
                    currentHue = (currentHue * (1 - redShift) + randomRange(0, 45) * redShift) % 360;
                    currentLightness = Math.max(currentLightness * (1 - redShift * 0.7), 20); 
                }

                this.color = `hsl(${currentHue}, 90%, ${currentLightness}%)`;
            }
        }

        class WillowParticle extends Particle {
            constructor(x, y, colorHue, speed, angle) {
                super(x, y, colorHue, speed, angle, 'willow');
                this.size = randomRange(2, 4); 
                this.decay = 0.003; 
                this.friction = 0.96; 
                this.trailTimer = 0;
            }

            update() {
                super.update(); 
                if (this.alpha > 0.1 && this.trailTimer % 2 === 0) {
                    particles.push(new SparkParticle(this.x, this.y, this.initialHue, this.velX, this.velY));
                }
                this.trailTimer++;
            }
        }


        // --- Firework Klasse (Rakete) ---

        class Firework {
            constructor(startX, startY, targetX, targetY, depth = 0, specificColorHue, specificType) {
                this.x = startX;
                this.y = startY;
                this.prevX = startX;
                this.prevY = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.depth = depth; 
                
                this.rocketColorHue = specificColorHue !== undefined ? specificColorHue : randomRange(0, 360);
                this.rocketColor = getColorData(this.rocketColorHue).hsl;
                
                const dx = targetX - startX;
                const dy = targetY - startY;
                this.distToTarget = Math.sqrt(dx * dx + dy * dy);
                this.distTraveled = 0;
                this.initialSpeed = 3; 
                this.maxSpeed = 15;
                this.acceleration = 0.15;
                this.angle = Math.atan2(dy, dx);
                this.velX = Math.cos(this.angle) * this.initialSpeed;
                this.velY = Math.sin(this.angle) * this.initialSpeed;
                
                if(depth === 0) playWhistle(this.distToTarget / 800); 
                
                const explosionOptions = depth === 0 
                    ? EXPLOSION_TYPES 
                    : ['peony', 'chrysanthemum', 'ring']; 
                this.explosionType = specificType || randomChoice(explosionOptions);
                
                // Für den 'color_shift' Typ: Definiere die zweite Farbe
                this.shiftHue = (this.rocketColorHue + randomRange(90, 270)) % 360;
            }

            update() {
                this.prevX = this.x;
                this.prevY = this.y;

                if (this.explosionType === 'looping_path') {
                    const loopStrength = 0.5; 
                    const loopFrequency = 0.05; 
                    const sineEffect = Math.sin(this.distTraveled * loopFrequency) * loopStrength;
                    const perpAngle = this.angle + Math.PI / 2;
                    this.velX += Math.cos(perpAngle) * sineEffect;
                    this.velY += Math.sin(perpAngle) * sineEffect;
                }

                const currentSpeed = Math.sqrt(this.velX * this.velX + this.velY * this.velY);
                if (currentSpeed < this.maxSpeed && this.distTraveled / this.distToTarget < 0.7) {
                    this.velX += Math.cos(this.angle) * this.acceleration;
                    this.velY += Math.sin(this.angle) * this.acceleration;
                }

                this.velX += WIND * 0.5;
                this.velY += GRAVITY * 0.2; 
                
                const burnoutDrag = 0.995;
                this.velX *= burnoutDrag;
                this.velY *= burnoutDrag;

                this.x += this.velX;
                this.y += this.velY;
                
                const currDist = Math.sqrt(this.velX * this.velX + this.velY * this.velY);
                this.distTraveled += currDist;

                const sparkCount = 2; 
                for (let i = 0; i < sparkCount; i++) {
                    // Funken nutzen den aktuellen Farbton der Rakete
                    particles.push(new SparkParticle(this.x, this.y, this.rocketColorHue, this.velX, this.velY));
                }

                if (this.y <= this.targetY || (this.velY > 0.5 && this.distTraveled / this.distToTarget > 0.6)) {
                    this.createExplosion(this.x, this.y);
                    return true; 
                } else {
                    return false;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'white'; 
                ctx.fillStyle = this.rocketColor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                const stickLength = 30; 
                const trajectoryAngle = Math.atan2(this.y - this.prevY, this.x - this.prevX);
                const startOffset = 4;
                const stickEndDistance = startOffset + stickLength; 
                
                const startX = this.x - Math.cos(trajectoryAngle) * startOffset; 
                const startY = this.y - Math.sin(trajectoryAngle) * startOffset; 
                const endX = this.x - Math.cos(trajectoryAngle) * stickEndDistance;
                const endY = this.y - Math.sin(trajectoryAngle) * stickEndDistance;

                ctx.lineWidth = 1;
                ctx.strokeStyle = '#333'; 
                ctx.globalAlpha = 0.8; 
                
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }

            createExplosion(x, y) {
                playBoom();
                let particleCount = randomRange(150, 250); 
                const maxSpeed = 5; 
                const minSpeed = 1.5;
                
                const mixedHue = (this.rocketColorHue + randomRange(-20, 20)) % 360; 

                switch(this.explosionType) {
                    case 'peony': 
                    case 'chrysanthemum': 
                    case 'ring': 
                    case 'looping_path': 
                    case 'wide_fan': 
                    case 'fountain':
                    case 'heart_shape':
                    case 'spiral': {
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            let speed = (this.explosionType === 'ring') ? 3 : randomRange(minSpeed, maxSpeed);
                            particles.push(new Particle(x, y, mixedHue, speed, angle, this.explosionType));
                        }
                        break;
                    }
                    case 'multi_shell': {
                        if (this.depth < MAX_SHELL_DEPTH) {
                            const shellCount = 6;
                            const initialSpeed = 3;
                            for (let i = 0; i < shellCount; i++) {
                                const angle = Math.random() * Math.PI * 2;
                                const speed = randomRange(initialSpeed * 0.8, initialSpeed * 1.2);
                                const targetOffset = 50;
                                const newTargetX = x + Math.cos(angle) * targetOffset;
                                const newTargetY = y + Math.sin(angle) * targetOffset;
                                fireworks.push(new Firework(x, y, newTargetX, newTargetY, this.depth + 1, this.rocketColorHue)); 
                            }
                            break; 
                        }
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = randomRange(minSpeed, maxSpeed);
                            particles.push(new Particle(x, y, mixedHue, speed, angle));
                        }
                        break;
                    }
                    case 'strobe': 
                    case 'strobe_fast': { 
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = randomRange(1, 4);
                            particles.push(new Particle(x, y, mixedHue, speed, angle, this.explosionType));
                        }
                        break;
                    }
                    case 'crackle': { 
                        particleCount = randomRange(300, 400); 
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = randomRange(2, 6);
                            particles.push(new Particle(x, y, mixedHue, speed, angle, 'crackle')); 
                        }
                        break;
                    }
                    case 'willow': { 
                        particleCount = randomRange(200, 250);
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = randomRange(0.5, 1.5); 
                            particles.push(new WillowParticle(x, y, mixedHue, speed, angle)); 
                        }
                        break;
                    }
                    case 'fish': { 
                        particleCount = randomRange(150, 200);
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = randomRange(1.5, 3);
                            particles.push(new Particle(x, y, mixedHue, speed, angle, 'fish'));
                        }
                        break;
                    }
                    case 'color_shift': {
                        particleCount = randomRange(180, 280);
                        for (let i = 0; i < particleCount; i++) {
                             const angle = Math.random() * Math.PI * 2;
                             const speed = randomRange(1.5, 4);
                             // Partikel starten mit mixedHue, wechseln dann zu this.shiftHue
                             particles.push(new Particle(x, y, mixedHue, speed, angle, 'color_shift', this.shiftHue));
                        }
                        break;
                    }
                }
            }
        }

        // --- Show Logik ---

        // Neue MASTER_SEQUENCE, basierend auf den ersten 40 Sekunden des YouTube-Videos (sehr dicht und intensiv).
        const MASTER_SEQUENCE = [
            // 0-10s: Eröffnung & Goldene Kaskaden (0:00 - 0:10)
            { time: 0, x_perc: 0.5, y_perc: 0.95, type: 'fountain', color_hue: 50 }, // Goldener Boden-Vulkan
            
            // Goldene Brokat-Peonies (0:01-0:02)
            { time: 1000, x_perc: 0.35, y_perc: 0.25, type: 'peony', color_hue: 50 }, 
            { time: 1500, x_perc: 0.65, y_perc: 0.25, type: 'peony', color_hue: 50 }, 

            // Willows (Trauerweiden) (0:03-0:04)
            { time: 3500, x_perc: 0.2, y_perc: 0.40, type: 'willow', color_hue: 60 },
            { time: 4000, x_perc: 0.8, y_perc: 0.40, type: 'willow', color_hue: 60 },
            
            // Ring und Crackle Cluster (0:05-0:07)

        function startShow() {
            if (isShowRunning) return;
            if (!audioContextStarted) startAudio();

            isShowRunning = true;
            showStartTime = performance.now();
            showSequence = [...MASTER_SEQUENCE]; 
            // Die nächste zufällige Rakete startet nach dem Ende der festen Sequenz, falls diese kürzer als die Gesamtdauer ist
            nextRandomLaunchTime = showStartTime + MASTER_SEQUENCE[MASTER_SEQUENCE.length - 1].time + randomRange(1000, 2000); 
            
            showButton.disabled = true;
            manualTypeButton.disabled = true;
            showButton.textContent = "Show läuft...";
            document.getElementById('info-overlay').style.display = 'none';
        }

        function launchEvent(event) {
            const startX = canvas.width / 2;
            const startY = canvas.height;
            const targetX = event.x_perc * canvas.width;
            const targetY = event.y_perc * canvas.height; 

            fireworks.push(new Firework(
                startX, 
                startY, 
                targetX, 
                targetY, 
                0, 
                event.color_hue,
                event.type
            ));
        }

        function launchRandomBurst(timeElapsed) {
            const targetX = randomRange(0.1, 0.9) * canvas.width;
            const targetY = randomRange(0.1, 0.6) * canvas.height;
            const randomHue = randomRange(0, 360);
            const randomType = randomChoice(EXPLOSION_TYPES);

            fireworks.push(new Firework(
                canvas.width / 2, 
                canvas.height, 
                targetX, 
                targetY, 
                0, 
                randomHue,
                randomType
            ));
            
            nextRandomLaunchTime = timeElapsed + randomRange(2500, 5000);
        }

        function updateShow(currentTime) {
            if (!isShowRunning) return;

            const timeElapsed = currentTime - showStartTime;

            while (showSequence.length > 0 && showSequence[0].time <= timeElapsed) {
                launchEvent(showSequence.shift());
            }
            
            if (showSequence.length === 0 && timeElapsed >= nextRandomLaunchTime) {
                // Nur zufällige Bursts, wenn die feste Sequenz abgeschlossen ist
                launchRandomBurst(timeElapsed);
            }

            if (timeElapsed >= SHOW_DURATION_MS) {
                isShowRunning = false;
                showButton.disabled = false;
                manualTypeButton.disabled = false;
                showButton.textContent = "Show starten (45 Sekunden)"; // Angepasster Text
                document.getElementById('info-overlay').style.display = 'block';
            } else {
                const remainingSeconds = Math.ceil((SHOW_DURATION_MS - timeElapsed) / 1000);
                showButton.textContent = `Show läuft (${remainingSeconds}s)`;
            }
        }


        // --- Haupt-Loop und Events ---

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function animate(timestamp) {
            ctx.fillStyle = 'rgba(10, 17, 26, 0.95)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height); 

            if (isShowRunning) {
                updateShow(timestamp);
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                const firework = fireworks[i];
                if (firework.update()) {
                    fireworks.splice(i, 1);
                } else {
                    firework.draw();
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.update();
                
                if (particle.alpha <= 0 || particle.y > canvas.height + 50) {
                    particles.splice(i, 1);
                } else {
                    particle.draw();
                }
            }

            requestAnimationFrame(animate);
        }

        function launchFireworkManual(event) {
            if (isShowRunning) return;

            event.preventDefault(); 
            
            if (!audioContextStarted) startAudio();

            const clickX = event.clientX || event.touches[0].clientX;
            const clickY = event.clientY || event.touches[0].clientY;
            
            const startX = clickX; 
            const startY = canvas.height;

            const maxY = canvas.height * 0.1;
            const explosionY = Math.max(clickY, maxY); 
            
            const targetX = clickX + randomRange(-10, 10);
            const targetY = explosionY - randomRange(50, 100); 

            const randomHue = randomRange(0, 360);
            
            if (targetY < startY) { 
                 fireworks.push(new Firework(startX, startY, targetX, targetY, 0, randomHue, currentManualType));
            }
        }

        window.addEventListener('resize', resizeCanvas);
        canvas.addEventListener('mousedown', launchFireworkManual);
        canvas.addEventListener('touchstart', launchFireworkManual);
        showButton.addEventListener('click', startShow);
        manualTypeButton.addEventListener('click', changeManualType);


        window.onload = function() {
            resizeCanvas();
            animate();
        };

    </script>
