<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feuerwerk-Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.9.15/build/Tone.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden; 
            /* Setzt den tiefen, konstanten Hintergrund */
            background: radial-gradient(ellipse at bottom, #0a111a 0%, #000 100%);
            font-family: 'Inter', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Sterne zur optischen Verbesserung */
        body::before {
            content: '';
            position: fixed; 
            top: 0;
            left: 0;
            width: 1px; 
            height: 1px;
            background: transparent;
            z-index: -1; 
            box-shadow: 
                100px 100px #fff, 200px 300px #fff, 400px 50px #fff, 600px 250px #fff, 800px 450px #fff, 1000px 50px #fff,
                10px 550px #fff, 250px 700px #fff, 450px 900px #fff, 650px 100px #fff, 850px 300px #fff, 1100px 700px #fff,
                50px 150px #fff, 350px 500px #fff, 750px 800px #fff, 950px 950px #fff, 150px 850px #fff, 550px 50px #fff,
                10px 10px 1px 1px #aed9e0, 50px 700px 1px 1px #aed9e0, 200px 20px 1px 1px #aed9e0, 500px 850px 1px 1px #aed9e0, 
                750px 150px 1px 1px #aed9e0, 950px 600px 1px 1px #aed9e0, 1150px 200px 1px 1px #aed9e0, 
                300px 900px 1px 1px #aed9e0, 1000px 800px 1px 1px #aed9e0, 50px 50px 1px 1px #aed9e0,
                1200px 100px #fff, 1250px 500px #fff, 1300px 800px #fff, 1350px 300px #fff, 1400px 650px #fff; 
        }
        
        canvas {
            display: block;
            touch-action: none; 
        }

        #info-overlay {
            position: absolute;
            top: 20px;
            text-align: center;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(174, 217, 224, 0.4);
            z-index: 10;
            user-select: none;
            font-size: 1.1rem;
            color: #aed9e0;
        }

        #show-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 25px;
            background: linear-gradient(135deg, #4CAF50, #2E8B57);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(46, 139, 87, 0.6);
            transition: all 0.2s ease-in-out;
            z-index: 20;
        }

        #show-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 139, 87, 0.8);
        }

        #show-button:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(46, 139, 87, 0.6);
        }

        #show-button:disabled {
            background: #444;
            cursor: not-allowed;
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            #info-overlay {
                top: 10px;
                font-size: 0.9rem;
            }
            #show-button {
                bottom: 10px;
                right: 10px;
                padding: 10px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <div id="info-overlay">
        Klicken oder tippen Sie auf den Himmel, um realistische, leuchtende Feuerwerke zu starten. (Audio wird beim ersten Klick aktiviert.)
    </div>

    <button id="show-button">Show starten (Alle 14 Typen)</button>

    <script>
        
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        const showButton = document.getElementById('show-button');

        let isShowRunning = false;
        let showStartTime = 0;
        let showSequence = [];
        let nextRandomLaunchTime = 0;
        let audioContextStarted = false;
        let boomSynth, kickSynth, whistleSynth; 
        let lastBoomTime = 0; 
        let lastWhistleTime = 0; 
        let fireworks = [];
        let particles = [];
        const GRAVITY = 0.08;      
        const AIR_RESISTANCE = 0.985; 
        const WIND = 0.005;        
        const MAX_SHELL_DEPTH = 3; 
        const SHOW_DURATION_MS = 60000;
        const EXPLOSION_TYPES = ['peony', 'chrysanthemum', 'ring', 'multi_shell', 'strobe', 'strobe_fast', 'crackle', 'willow', 'fish', 'wide_fan', 'looping_path', 'fountain', 'heart_shape', 'spiral'];

        function randomRange(min, max) { return Math.random() * (max - min) + min; }
        function randomChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function getRandomColor(hue) {
            const h = hue !== undefined ? hue : randomRange(0, 360);
            const s = randomRange(90, 100);
            const l = randomRange(60, 80);
            return `hsl(${h}, ${s}%, ${l}%)`;
        }

        // --- Show-Definition ---
        const MASTER_SEQUENCE = [
            // PHASE 1: Eröffnung und Klassiker (0s - 10s)
            { time: 0, x_perc: 0.5, y_perc: 0.95, type: 'fountain', color_hue: 180 }, 
            { time: 1000, x_perc: 0.5, y_perc: 0.20, type: 'chrysanthemum', color_hue: 240 }, 
            
            { time: 2500, x_perc: 0.2, y_perc: 0.35, type: 'wide_fan', color_hue: 120 },
            { time: 3000, x_perc: 0.8, y_perc: 0.35, type: 'peony', color_hue: 30 },
            
            { time: 4500, x_perc: 0.1, y_perc: 0.15, type: 'ring', color_hue: 270 },
            { time: 4500, x_perc: 0.9, y_perc: 0.15, type: 'ring', color_hue: 270 },

            // NEU: Einfache Spezialeffekte (Langsamer Strobe, Looping Path, Spiral)
            { time: 6000, x_perc: 0.5, y_perc: 0.40, type: 'strobe', color_hue: 300 }, // LANGSAMER STROBE
            { time: 8000, x_perc: 0.3, y_perc: 0.25, type: 'looping_path', color_hue: 150 },
            { time: 8500, x_perc: 0.7, y_perc: 0.25, type: 'spiral', color_hue: 330 },


            // PHASE 2: Intensivere Effekte (Willow, Crackle, Multi-Shell, Fish) (10s - 25s)
            
            { time: 10000, x_perc: 0.5, y_perc: 0.30, type: 'willow', color_hue: 90 },
            
            { time: 12000, x_perc: 0.25, y_perc: 0.45, type: 'crackle', color_hue: 60 },
            { time: 12500, x_perc: 0.75, y_perc: 0.45, type: 'crackle', color_hue: 60 },
            
            { time: 15000, x_perc: 0.1, y_perc: 0.15, type: 'multi_shell', color_hue: 300 },
            { time: 15500, x_perc: 0.9, y_perc: 0.15, type: 'multi_shell', color_hue: 300 },
            
            { time: 18000, x_perc: 0.5, y_perc: 0.50, type: 'fish', color_hue: 210 }, 
            
            { time: 20000, x_perc: 0.2, y_perc: 0.35, type: 'strobe_fast', color_hue: 0 }, // SCHNELLER STROBE
            { time: 20500, x_perc: 0.8, y_perc: 0.35, type: 'strobe_fast', color_hue: 0 },
            
            { time: 23000, x_perc: 0.5, y_perc: 0.35, type: 'heart_shape', color_hue: 0 }, // HERZFORM


            // PHASE 3: Kontinuierliche Steigerung (25s - 45s)

            { time: 26000, x_perc: 0.3, y_perc: 0.60, type: 'chrysanthemum', color_hue: 150 },
            { time: 26500, x_perc: 0.7, y_perc: 0.60, type: 'chrysanthemum', color_hue: 150 },
            
            { time: 30000, x_perc: 0.5, y_perc: 0.95, type: 'fountain', color_hue: 20 },

            { time: 32000, x_perc: 0.1, y_perc: 0.3, type: 'peony', color_hue: 30 },
            { time: 32500, x_perc: 0.3, y_perc: 0.2, type: 'wide_fan', color_hue: 60 },
            { time: 33000, x_perc: 0.7, y_perc: 0.2, type: 'wide_fan', color_hue: 60 },
            { time: 33500, x_perc: 0.9, y_perc: 0.3, type: 'peony', color_hue: 30 },
            
            { time: 35000, x_perc: 0.4, y_perc: 0.25, type: 'ring', color_hue: 180 },
            { time: 35500, x_perc: 0.6, y_perc: 0.25, type: 'ring', color_hue: 180 },

            { time: 40000, x_perc: 0.15, y_perc: 0.25, type: 'multi_shell', color_hue: 300 },
            { time: 40000, x_perc: 0.35, y_perc: 0.35, type: 'multi_shell', color_hue: 180 },
            { time: 40000, x_perc: 0.65, y_perc: 0.35, type: 'multi_shell', color_hue: 180 },
            { time: 40000, x_perc: 0.85, y_perc: 0.25, type: 'multi_shell', color_hue: 300 },
            

            // PHASE 4: GRAND FINALE VORBEREITUNG (45s - 60s)

            { time: 45000, x_perc: 0.1, y_perc: 0.45, type: 'willow', color_hue: 90 },
            { time: 45500, x_perc: 0.3, y_perc: 0.35, type: 'willow', color_hue: 90 },
            { time: 46000, x_perc: 0.5, y_perc: 0.25, type: 'willow', color_hue: 90 },
            { time: 46500, x_perc: 0.7, y_perc: 0.35, type: 'willow', color_hue: 90 },
            { time: 47000, x_perc: 0.9, y_perc: 0.45, type: 'willow', color_hue: 90 },

            { time: 50000, x_perc: 0.2, y_perc: 0.3, type: 'crackle', color_hue: 0 },
            { time: 50500, x_perc: 0.8, y_perc: 0.3, type: 'chrysanthemum', color_hue: 30 },
            { time: 51000, x_perc: 0.4, y_perc: 0.2, type: 'peony', color_hue: 60 },
            { time: 51500, x_perc: 0.6, y_perc: 0.2, type: 'crackle', color_hue: 90 },
            { time: 52000, x_perc: 0.5, y_perc: 0.1, type: 'chrysanthemum', color_hue: 120 },
            
            // Finale
            { time: 56000, x_perc: 0.25, y_perc: 0.2, type: 'multi_shell', color_hue: 300 },
            { time: 56000, x_perc: 0.75, y_perc: 0.2, type: 'multi_shell', color_hue: 330 },
            { time: 58000, x_perc: 0.5, y_perc: 0.95, type: 'fountain', color_hue: 20 } 
        ];


        // --- Audio Funktionen ---

        function startAudio() {
            if (audioContextStarted) return;
            Tone.start().then(() => {
                boomSynth = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.2, sustain: 0.0, release: 0.05 }}).toDestination();
                kickSynth = new Tone.MembraneSynth({ envelope: { attack: 0.001, decay: 0.4, sustain: 0.001 }}).toDestination();
                whistleSynth = new Tone.MonoSynth({
                    oscillator: { type: "square" },
                    envelope: { attack: 0.005, decay: 0.8, sustain: 0.0, release: 0.1 },
                    filterEnvelope: { attack: 0.005, decay: 0.5, sustain: 0, release: 0.1, baseFrequency: 500, octaves: 5, exponent: 2}
                }).toDestination();
                audioContextStarted = true;
            }).catch(e => console.error("Tone.js Startfehler:", e));
        }

        function playBoom() {
            if (audioContextStarted && boomSynth && kickSynth) {
                let now = Tone.now();
                const baseTime = Math.max(now + 0.002, lastBoomTime + 0.0001);
                lastBoomTime = baseTime;
                boomSynth.triggerAttackRelease(0.2, baseTime, 0.7); 
                kickSynth.triggerAttackRelease("C1", 0.5, baseTime + 0.000001, 1); 
            }
        }

        function playWhistle(duration = 0.5) {
            if (audioContextStarted && whistleSynth) {
                let now = Tone.now();
                const startTime = Math.max(now + 0.002, lastWhistleTime + 0.01); 
                lastWhistleTime = startTime; 
                whistleSynth.triggerAttackRelease("C6", duration, startTime); 
                whistleSynth.frequency.linearRampToValueAtTime("C2", startTime + duration);
            }
        }


        // --- Partikel Klassen ---

        class Particle {
            constructor(x, y, color, speed, angle, isStrobe = false, isCrackle = false, isFish = false, strobeSpeed = 4) { 
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = isCrackle ? randomRange(0.5, 1.5) : randomRange(1.5, 3.5); 
                this.velX = Math.cos(angle) * speed;
                this.velY = Math.sin(angle) * speed;
                this.alpha = 1; 
                this.friction = AIR_RESISTANCE;
                // V20 ANPASSUNG: Längere Effekte für Standard-Partikel
                this.decay = isCrackle ? randomRange(0.025, 0.05) : randomRange(0.01, 0.025); 
                this.isStrobe = isStrobe;
                this.isCrackle = isCrackle;
                this.isFish = isFish; 
                this.strobeTick = 0; 
                this.strobeSpeed = strobeSpeed;
            }

            update() {
                this.velX *= this.friction * 0.99; 
                this.velY *= this.friction;

                this.velY += GRAVITY;
                this.velX += WIND;

                if (this.isFish) {
                    this.velX += randomRange(-0.2, 0.2); 
                    this.velY += randomRange(-0.2, 0.2);
                    const maxFishSpeed = 3;
                    const currentSpeed = Math.sqrt(this.velX * this.velX + this.velY * this.velY);
                    if (currentSpeed > maxFishSpeed) {
                        this.velX *= (maxFishSpeed / currentSpeed);
                        this.velY *= (maxFishSpeed / currentSpeed);
                    }
                }

                this.x += this.velX;
                this.y += this.velY;

                if (this.isStrobe) {
                    this.strobeTick++;
                    this.alpha = (this.strobeTick % this.strobeSpeed < (this.strobeSpeed / 2)) ? 1 : 0.2;
                    // V20 ANPASSUNG: Längere Effekte für Strobe (sehr geringer Zerfall)
                    this.decay = 0.002; 
                } else {
                    this.alpha -= this.decay;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = this.size * 2.5;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }
        
        class SparkParticle extends Particle {
            constructor(x, y, color, velX, velY) {
                super(x, y, color, 0, 0, false, false, false); 
                this.size = randomRange(0.5, 1.5); 
                this.decay = randomRange(0.05, 0.1); 
                this.friction = 0.95; 
                this.velX = velX * randomRange(0.1, 0.2) + randomRange(-0.5, 0.5); 
                this.velY = velY * randomRange(0.1, 0.2) + randomRange(-0.5, 0.5);
            }
            
            update() {
                this.velX *= this.friction; 
                this.velY *= this.friction;
                this.velY += GRAVITY * 0.2; 
                this.velX += WIND * 0.1;
                this.x += this.velX;
                this.y += this.velY;
                this.alpha -= this.decay;
            }
        }

        class WillowParticle extends Particle {
            constructor(x, y, color, speed, angle) {
                super(x, y, color, speed, angle, false, false, false);
                this.size = randomRange(2, 4); 
                // V20 ANPASSUNG: Längere Effekte für Willow (langsamer zerfallende Kaskade)
                this.decay = 0.005; 
                this.friction = 0.96; 
                this.trailTimer = 0;
            }

            update() {
                super.update(); 
                if (this.alpha > 0.1 && this.trailTimer % 2 === 0) {
                    particles.push(new SparkParticle(this.x, this.y, this.color, this.velX, this.velY));
                }
                this.trailTimer++;
            }
        }


        // --- Firework Klasse ---

        class Firework {
            constructor(startX, startY, targetX, targetY, depth = 0, specificColorHue, specificType) {
                this.x = startX;
                this.y = startY;
                this.prevX = startX;
                this.prevY = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.depth = depth; 
                this.rocketColor = specificColorHue !== undefined ? getRandomColor(specificColorHue) : getRandomColor();
                this.hue = parseFloat(this.rocketColor.match(/hsl\((\d+)/)[1]);
                const dx = targetX - startX;
                const dy = targetY - startY;
                this.distToTarget = Math.sqrt(dx * dx + dy * dy);
                this.distTraveled = 0;
                this.initialSpeed = 3; 
                this.maxSpeed = 15;
                this.acceleration = 0.15;
                this.angle = Math.atan2(dy, dx);
                this.velX = Math.cos(this.angle) * this.initialSpeed;
                this.velY = Math.sin(this.angle) * this.initialSpeed;
                if(depth === 0) playWhistle(this.distToTarget / 800);
                
                const explosionOptions = depth === 0 
                    ? EXPLOSION_TYPES 
                    : ['peony', 'chrysanthemum', 'ring']; 
                this.explosionType = specificType || randomChoice(explosionOptions);
            }

            update() {
                this.prevX = this.x;
                this.prevY = this.y;

                if (this.explosionType === 'looping_path') {
                    const loopStrength = 0.5; 
                    const loopFrequency = 0.05; 
                    const sineEffect = Math.sin(this.distTraveled * loopFrequency) * loopStrength;
                    const perpAngle = this.angle + Math.PI / 2;
                    this.velX += Math.cos(perpAngle) * sineEffect;
                    this.velY += Math.sin(perpAngle) * sineEffect;
                }

                const currentSpeed = Math.sqrt(this.velX * this.velX + this.velY * this.velY);
                if (currentSpeed < this.maxSpeed && this.distTraveled / this.distToTarget < 0.7) {
                    this.velX += Math.cos(this.angle) * this.acceleration;
                    this.velY += Math.sin(this.angle) * this.acceleration;
                }

                this.velX += WIND * 0.5;
                this.velY += GRAVITY * 0.2; 
                
                const burnoutDrag = 0.995;
                this.velX *= burnoutDrag;
                this.velY *= burnoutDrag;

                this.x += this.velX;
                this.y += this.velY;
                
                const currDist = Math.sqrt(this.velX * this.velX + this.velY * this.velY);
                this.distTraveled += currDist;

                const sparkCount = 2; 
                for (let i = 0; i < sparkCount; i++) {
                    particles.push(new SparkParticle(this.x, this.y, this.rocketColor, this.velX, this.velY));
                }

                if (this.y <= this.targetY || (this.velY > 0.5 && this.distTraveled / this.distToTarget > 0.6)) {
                    this.createExplosion(this.x, this.y);
                    return true;
                } else {
                    return false;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'white'; 
                ctx.fillStyle = this.rocketColor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                const stickLength = 30; 
                const angle = Math.atan2(this.y - this.prevY, this.x - this.prevX) - Math.PI / 2; 
                const startX = this.x + Math.cos(angle) * 4; 
                const startY = this.y + Math.sin(angle) * 4; 
                const endX = startX - Math.cos(angle) * stickLength;
                const endY = startY - Math.sin(angle) * stickLength;

                ctx.lineWidth = 1;
                ctx.strokeStyle = '#333'; 
                ctx.globalAlpha = 0.8; 
                
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }

            createExplosion(x, y) {
                playBoom();
                let particleCount = randomRange(150, 250); 
                const maxSpeed = 5; 
                const minSpeed = 1.5;
                const mixedHue = (this.hue + randomRange(-30, 30)) % 360; 
                const particleColor = getRandomColor(mixedHue);

                switch(this.explosionType) {
                    case 'peony': 
                    case 'chrysanthemum': 
                    case 'ring': 
                    case 'looping_path': {
                        const isChrysanthemum = this.explosionType === 'chrysanthemum';
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            let speed;
                            if (isChrysanthemum) {
                                speed = randomRange(maxSpeed * 0.6, maxSpeed * 1.0); 
                            } else if (this.explosionType === 'ring') {
                                speed = 3;
                            } else {
                                speed = randomRange(minSpeed, maxSpeed);
                            }
                            particles.push(new Particle(x, y, particleColor, speed, angle));
                        }
                        break;
                    }
                    case 'multi_shell': {
                        if (this.depth < MAX_SHELL_DEPTH) {
                            const shellCount = 6;
                            const initialSpeed = 3;
                            for (let i = 0; i < shellCount; i++) {
                                const angle = Math.random() * Math.PI * 2;
                                const speed = randomRange(initialSpeed * 0.8, initialSpeed * 1.2);
                                const targetOffset = 50;
                                const newTargetX = x + Math.cos(angle) * targetOffset;
                                const newTargetY = y + Math.sin(angle) * targetOffset;
                                fireworks.push(new Firework(x, y, newTargetX, newTargetY, this.depth + 1)); 
                            }
                            break; 
                        }
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = randomRange(minSpeed, maxSpeed);
                            particles.push(new Particle(x, y, particleColor, speed, angle));
                        }
                        break;
                    }
                    case 'strobe': { 
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = randomRange(1, 3);
                            particles.push(new Particle(x, y, particleColor, speed, angle, true, false, false, 8)); // Langsamerer Blitz
                        }
                        break;
                    }
                    case 'strobe_fast': { 
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = randomRange(2, 4);
                            particles.push(new Particle(x, y, particleColor, speed, angle, true, false, false, 2)); // Schneller Blitz
                        }
                        break;
                    }
                    case 'crackle': { 
                        particleCount = randomRange(300, 400); 
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = randomRange(2, 6);
                            particles.push(new Particle(x, y, particleColor, speed, angle, false, true)); 
                        }
                        break;
                    }
                    case 'willow': { 
                        particleCount = randomRange(100, 150);
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = randomRange(0.5, 1.5); 
                            particles.push(new WillowParticle(x, y, particleColor, speed, angle)); 
                        }
                        break;
                    }
                    case 'fish': { 
                        particleCount = randomRange(100, 150);
                        for (let i = 0; i < particleCount; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = randomRange(1.5, 3);
                            particles.push(new Particle(x, y, particleColor, speed, angle, false, false, true));
                        }
                        break;
                    }
                    case 'wide_fan': { 
                        const fanAngle = Math.PI * 0.8; 
                        const startAngle = -Math.PI * 0.5 - fanAngle / 2;
                        const endAngle = -Math.PI * 0.5 + fanAngle / 2;
                        particleCount = randomRange(200, 300); 
                        const baseSpeed = 5;
                        for (let i = 0; i < particleCount; i++) {
                            const angle = startAngle + (i / particleCount) * fanAngle;
                            let speed = baseSpeed;
                            const edgeFactor = 1 + Math.abs(i / particleCount - 0.5) * 1.5; 
                            speed *= edgeFactor * randomRange(0.8, 1.2); 
                            particles.push(new Particle(x, y, particleColor, speed, angle));
                        }
                        break;
                    }
                    case 'fountain': { 
                        particleCount = randomRange(100, 150);
                        const verticalSpeed = 10; 
                        const spreadAngle = Math.PI * 0.08; 
                        for (let i = 0; i < particleCount; i++) {
                            const angle = randomRange(-Math.PI * 0.5 - spreadAngle / 2, -Math.PI * 0.5 + spreadAngle / 2);
                            const speed = randomRange(verticalSpeed * 0.8, verticalSpeed * 1.2); 
                            particles.push(new Particle(x, y, particleColor, speed, angle));
                        }
                        break;
                    }
                    case 'heart_shape': { 
                        particleCount = 150;
                        for (let i = 0; i < particleCount; i++) {
                            const t = i / particleCount * 2 * Math.PI; 
                            const px = 16 * Math.pow(Math.sin(t), 3);
                            const py = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                            const velX = px * 0.15 + randomRange(-0.3, 0.3); 
                            const velY = py * 0.15 + randomRange(-0.3, 0.3);
                            particles.push(new Particle(x, y, particleColor, 1, 0)); 
                            particles[particles.length - 1].velX = velX;
                            particles[particles.length - 1].velY = velY;
                        }
                        break;
                    }
                    case 'spiral': {
                        particleCount = 200;
                        const initialRadius = 1; 
                        const expansionRate = 0.5;
                        const totalTurns = 4; 
                        const rotationalSpeed = 0.2; 
                        for (let i = 0; i < particleCount; i++) {
                            const progress = i / particleCount;
                            const angle = progress * totalTurns * Math.PI * 2; 
                            const radius = initialRadius + progress * expansionRate * 10; 
                            const radialVelX = Math.cos(angle) * radius * 0.1;
                            const radialVelY = Math.sin(angle) * radius * 0.1;
                            const tangentialVelX = Math.cos(angle + Math.PI / 2) * rotationalSpeed * radius * 0.05;
                            const tangentialVelY = Math.sin(angle + Math.PI / 2) * rotationalSpeed * radius * 0.05;
                            const velX = radialVelX + tangentialVelX;
                            const velY = radialVelY + tangentialVelY;
                            particles.push(new Particle(x, y, particleColor, 1, 0));
                            particles[particles.length - 1].velX = velX * randomRange(0.8, 1.2);
                            particles[particles.length - 1].velY = velY * randomRange(0.8, 1.2);
                            particles[particles.length - 1].friction = 0.99;
                        }
                        break;
                    }
                }
            }
        }

        // --- Show Logik ---

        function startShow() {
            if (isShowRunning) return;
            if (!audioContextStarted) startAudio();

            isShowRunning = true;
            showStartTime = performance.now();
            showSequence = [...MASTER_SEQUENCE];
            nextRandomLaunchTime = showStartTime + randomRange(3000, 5000); 
            
            showButton.disabled = true;
            showButton.textContent = "Show läuft...";
            document.getElementById('info-overlay').style.display = 'none';
        }

        function launchEvent(event) {
            const startX = canvas.width / 2;
            const startY = canvas.height;
            const targetX = event.x_perc * canvas.width;
            const targetY = event.y_perc * canvas.height; 

            fireworks.push(new Firework(
                startX, 
                startY, 
                targetX, 
                targetY, 
                0, 
                event.color_hue,
                event.type
            ));
        }

        function launchRandomBurst(timeElapsed) {
            const targetX = randomRange(0.1, 0.9) * canvas.width;
            const targetY = randomRange(0.1, 0.6) * canvas.height;
            const randomHue = randomRange(0, 360);
            const randomType = randomChoice(EXPLOSION_TYPES);

            fireworks.push(new Firework(
                canvas.width / 2, 
                canvas.height, 
                targetX, 
                targetY, 
                0, 
                randomHue,
                randomType
            ));
            
            nextRandomLaunchTime = timeElapsed + randomRange(2500, 5000);
        }

        function updateShow(currentTime) {
            if (!isShowRunning) return;

            const timeElapsed = currentTime - showStartTime;

            while (showSequence.length > 0 && showSequence[0].time <= timeElapsed) {
                launchEvent(showSequence.shift());
            }
            
            if (timeElapsed >= nextRandomLaunchTime) {
                launchRandomBurst(timeElapsed);
            }

            if (timeElapsed >= SHOW_DURATION_MS) {
                isShowRunning = false;
                showButton.disabled = false;
                showButton.textContent = "Show starten (Alle 14 Typen)";
                document.getElementById('info-overlay').style.display = 'block';
            } else {
                const remainingSeconds = Math.ceil((SHOW_DURATION_MS - timeElapsed) / 1000);
                showButton.textContent = `Show läuft (${remainingSeconds}s)`;
            }
        }


        // --- Haupt-Loop und Events ---

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function animate(timestamp) {
            // FIX: Beibehaltung des stabilen Hintergrunds mit einem hohen Alpha-Wert (0.95)
            ctx.fillStyle = 'rgba(10, 17, 26, 0.95)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height); 

            if (isShowRunning) {
                updateShow(timestamp);
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                const firework = fireworks[i];
                if (firework.update()) {
                    fireworks.splice(i, 1);
                } else {
                    firework.draw();
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.update();
                
                if (particle.alpha <= 0 || particle.y > canvas.height + 50) {
                    particles.splice(i, 1);
                } else {
                    particle.draw();
                }
            }

            requestAnimationFrame(animate);
        }

        function launchFireworkManual(event) {
            if (isShowRunning) return;

            event.preventDefault(); 
            
            if (!audioContextStarted) startAudio();

            const x = event.clientX || event.touches[0].clientX;
            const y = event.clientY || event.touches[0].clientY;

            const targetY = Math.min(y, canvas.height * 0.9); 

            if (targetY < canvas.height * 0.9) { 
                 fireworks.push(new Firework(canvas.width / 2, canvas.height, x, targetY, 0));
            }
        }

        window.addEventListener('resize', resizeCanvas);
        canvas.addEventListener('mousedown', launchFireworkManual);
        canvas.addEventListener('touchstart', launchFireworkManual);
        showButton.addEventListener('click', startShow);


        window.onload = function() {
            resizeCanvas();
            animate();
        };

    </script>

</body>
