<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Willkommen – Deine neue Webseite</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="animations.css">
</head>
<body>
  <header>
    <h1>Willkommen auf deiner neuen Webseite!</h1>
  </header>
  <main>
    <section id="webradio" class="pop-animate mouse-glow" style="transform: perspective(600px) rotateX(-5.55282deg) rotateY(4.43529deg) translateX(5.54412px) translateY(6.94102px);">
      <h2>Webradio</h2>
      <div id="webradio-player" style="display: flex; flex-direction: row; align-items: flex-end; gap: 18px; flex-wrap: wrap;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
          <button id="radio-toggle" aria-label="Play" class="icon-btn" style="">
            <svg width="44" height="44" viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="20" fill="#1db954"></circle>
              <polygon points="15,10 32,20 15,30" fill="#fff"></polygon>
            </svg>
          </button>
          <button id="radio-pause" aria-label="Pause" class="icon-btn" style="display: none;">
            <svg width="44" height="44" viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="20" fill="#f1c40f"></circle>
              <rect x="13" y="10" width="5" height="20" rx="2" fill="#fff"></rect>
              <rect x="22" y="10" width="5" height="20" rx="2" fill="#fff"></rect>
            </svg>
          </button>
          <button id="radio-stop" aria-label="Stop" class="icon-btn" style="display: none;">
            <svg width="44" height="44" viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="20" fill="#e74c3c"></circle>
              <rect x="13" y="13" width="14" height="14" rx="3" fill="#fff"></rect>
            </svg>
          </button>
        </div>
        <div style="display: flex; flex-direction: column; justify-content: flex-start; gap: 8px; min-width: 220px;">
          <label for="radio-station">Sender wählen:</label>
          <select id="radio-station">
            <option value="https://stream.radioparadise.com/mp3-192">Radio Paradise</option>
            <option value="https://radio.bbg-bew.de">BBG</option>
            <option value="https://stream.radioparadise.com/mp3-190">The Main Mix</option>
            <option value="https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3?aggregator=web">Deutschlandfunk</option>
            <option value="https://st02.sslstream.dlf.de/dlf/02/128/mp3/stream.mp3?aggregator=web">Deutschlandfunk Kultur</option>
            <option value="https://st03.sslstream.dlf.de/dlf/03/128/mp3/stream.mp3?aggregator=web">Deutschlandfunk Nova</option>
          </select>
          <span id="radio-time" style="min-width:60px;display:inline-block;color:var(--muted);font-size:1.05em;margin-left:0;">00:00</span>
        </div>
        <audio id="radio-audio" preload="true" autoplay=""></audio>
      </div>
    </section>
  </main>
  <footer>
    © 2025 Deine neue Webseite
  </footer>
  <script>
    // Webradio-Player Logik
    const radioAudio = document.getElementById('radio-audio');
    const radioToggle = document.getElementById('radio-toggle');
    const radioStation = document.getElementById('radio-station');

    function createRadioIcon(type) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', '44');
      svg.setAttribute('height', '44');
      svg.setAttribute('viewBox', '0 0 40 40');
      if(type === 'play') {
        svg.innerHTML = '<polygon points="15,10 32,20 15,30" fill="#fff"/>';
      } else if(type === 'pause') {
        svg.innerHTML = '<circle cx="20" cy="20" r="20" fill="#f1c40f"/><rect x="13" y="10" width="5" height="20" rx="2" fill="#fff"/><rect x="22" y="10" width="5" height="20" rx="2" fill="#fff"/>';
      } else if(type === 'stop') {
        svg.innerHTML = '<circle cx="20" cy="20" r="20" fill="#e74c3c"/><rect x="13" y="13" width="14" height="14" rx="3" fill="#fff"/>';
      }
      return svg;
    }
    function showRadioPlay() {
      radioToggle.style.display = '';
      radioPause.style.display = 'none';
      radioStop.style.display = 'none';
      radioToggle.innerHTML = '';
      radioToggle.appendChild(createRadioIcon('play'));
      radioToggle.setAttribute('aria-label', 'Play');
    }
    function showRadioPauseStop() {
      radioToggle.style.display = 'none';
      radioPause.style.display = '';
      radioStop.style.display = '';
      radioPause.innerHTML = '';
      radioPause.appendChild(createRadioIcon('pause'));
      radioPause.setAttribute('aria-label', 'Pause');
      radioStop.innerHTML = '';
      radioStop.appendChild(createRadioIcon('stop'));
      radioStop.setAttribute('aria-label', 'Stop');
    }
    function showRadioPlayStop() {
      radioToggle.style.display = '';
      radioPause.style.display = 'none';
      radioStop.style.display = '';
      radioToggle.innerHTML = '';
      radioToggle.appendChild(createRadioIcon('play'));
      radioToggle.setAttribute('aria-label', 'Play');
      radioStop.innerHTML = '';
      radioStop.appendChild(createRadioIcon('stop'));
      radioStop.setAttribute('aria-label', 'Stop');
    }
    // Initialisiere mit Play-Icon
    const radioPause = document.getElementById('radio-pause');
    const radioStop = document.getElementById('radio-stop');
    const radioTime = document.getElementById('radio-time');
    let timeInterval = null;
    let streamStartTimestamp = null;
    let pausedAt = null;
    function updateRadioTime() {
      if (streamStartTimestamp !== null) {
        let elapsed;
        if (pausedAt !== null) {
          elapsed = pausedAt - streamStartTimestamp;
        } else {
          elapsed = Date.now() - streamStartTimestamp;
        }
        elapsed = Math.floor(elapsed / 1000);
        const min = String(Math.floor(elapsed/60)).padStart(2,'0');
        const sec = String(elapsed%60).padStart(2,'0');
        radioTime.textContent = `${min}:${sec}`;
      } else {
        radioTime.textContent = '00:00';
      }
    }
    function startRadioTimer() {
      if (streamStartTimestamp === null) streamStartTimestamp = Date.now();
      pausedAt = null;
      updateRadioTime();
      if (timeInterval) clearInterval(timeInterval);
      timeInterval = setInterval(updateRadioTime, 500);
    }
    function stopRadioTimer(reset=true) {
      if (timeInterval) clearInterval(timeInterval);
      if (reset) {
        radioTime.textContent = '00:00';
        streamStartTimestamp = null;
        pausedAt = null;
      }
    }
    function initRadioUI() {
      stopRadioTimer();
      streamStartTimestamp = null;
      pausedAt = null;
      showRadioPlay();
      radioTime.textContent = '00:00';
    }
    initRadioUI();
    // Play-Button
    radioToggle.onclick = function() {
      const selectedSrc = radioStation.value;
      if (!radioAudio.src) {
        radioAudio.src = selectedSrc;
        radioAudio.load();
      }
      radioAudio.volume = 1.0;
      radioAudio.play();
      showRadioPauseStop();
      if (streamStartTimestamp === null) streamStartTimestamp = Date.now();
      if (pausedAt !== null) {
        // Passe Startzeit an, damit die Anzeige weiterläuft
        streamStartTimestamp += (Date.now() - pausedAt);
        pausedAt = null;
      }
      startRadioTimer();
    };
    // Pause-Button
    radioPause.onclick = function() {
      radioAudio.pause();
      showRadioPlayStop();
      if (streamStartTimestamp !== null) pausedAt = Date.now();
      stopRadioTimer(false);
    };
    // Stop-Button
    radioStop.onclick = function() {
      radioAudio.pause();
      radioAudio.removeAttribute('src');
      radioAudio.load();
      showRadioPlay();
      stopRadioTimer();
    };
    // Senderwechsel pausiert und setzt den Stream zurück
    radioStation.addEventListener('change', () => {
      radioAudio.pause();
      radioAudio.removeAttribute('src');
      radioAudio.load();
      showRadioPlay();
      stopRadioTimer();
    });
    // Icon-Status synchronisieren
    radioAudio.addEventListener('play', () => {
      showRadioPauseStop();
      if (streamStartTimestamp === null) streamStartTimestamp = Date.now();
      if (pausedAt !== null) {
        streamStartTimestamp += (Date.now() - pausedAt);
        pausedAt = null;
      }
      startRadioTimer();
    });
    radioAudio.addEventListener('pause', () => {
      if (!radioAudio.src || radioAudio.currentTime === 0) {
        showRadioPlay();
        stopRadioTimer();
      } else {
        showRadioPlayStop();
        if (streamStartTimestamp !== null) pausedAt = Date.now();
        stopRadioTimer(false);
      }
    });
    radioAudio.addEventListener('ended', () => {
      stopRadioTimer();
    });
    // Performance-Optimierung: Mousemove-Handler throttlen
    const section = document.querySelector('section');
    if(section) {
      let animFrame;
      section.addEventListener('mousemove', e => {
        if(animFrame) return;
        animFrame = requestAnimationFrame(() => {
          const rect = section.getBoundingClientRect();
          const x = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
          const y = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
          const maxTilt = 8;
          const maxTrans = 10;
          section.style.transform = `perspective(600px) rotateX(${-y*maxTilt}deg) rotateY(${x*maxTilt}deg) translateX(${x*maxTrans}px) translateY(${y*maxTrans}px)`;
          section.classList.add('mouse-glow');
          animFrame = null;
        });
      });
      section.addEventListener('mouseleave', () => {
        section.style.transform = '';
        section.classList.remove('mouse-glow');
      });
      section.addEventListener('mouseenter', () => {
        section.classList.remove('pop-animate');
        void section.offsetWidth;
        section.classList.add('pop-animate');
      });
    }
    // Deployment-Optimierung: Service Worker für Offline-Support (optional)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>




</body>
</html>
