<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oidarwave - Ihr Webradio Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🎵 Oidarwave</div>
            <nav>
                <a href="#radio">Radio</a>
                <a href="#kontakt">Kontakt</a>
                <a href="#impressum">Impressum</a>
                <a href="#datenschutz">Datenschutz</a>
            </nav>
        </header>

        <main class="radio-container" id="radio">
            <div class="player-section">
                <div class="station-selector">
                    <h2>📻 Sender auswählen</h2>
                    <div class="station-grid">
                        <button class="station-btn" data-url="http://stream.radioparadise.com/aac-320" data-name="Radio Paradise">
                            Radio Paradise
                        </button>
                        <button class="station-btn" data-url="https://dispatcher.rndfnk.com/br/br1/franken/mp3/high" data-name="BR1 Franken">
                            BR1 Franken
                        </button>
                        <button class="station-btn" data-url="https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3" data-name="Deutschlandfunk">
                            Deutschlandfunk
                        </button>
                        <button class="station-btn" data-url="https://st02.sslstream.dlf.de/dlf/02/128/mp3/stream.mp3" data-name="Deutschlandfunk Kultur">
                            DLF Kultur
                        </button>
                        <button class="station-btn" data-url="https://st03.sslstream.dlf.de/dlf/03/128/mp3/stream.mp3" data-name="Deutschlandfunk Nova">
                            DLF Nova
                        </button>
                        <button class="station-btn" data-url="https://ndr-ndr1niedersachsen-hannover.sslcast.addradio.de/ndr/ndr1niedersachsen/hannover/mp3/128/stream.mp3" data-name="NDR 1 Niedersachsen">
                            NDR 1
                        </button>
                        <button class="station-btn" data-url="https://ndr-ndrinfo-nds.sslcast.addradio.de/ndr/ndrinfo/nds/mp3/128/stream.mp3" data-name="NDR Info">
                            NDR 2
                        </button>
                        <button class="station-btn" data-url="https://ndr-ndr2-nds.sslcast.addradio.de/ndr/ndr2/nds/mp3/128/stream.mp3" data-name="NDR 2">
                            NDR Info
                        </button>
                        <button class="station-btn" data-url="https://ndr-ndrkultur.sslcast.addradio.de/ndr/ndrkultur/live/mp3/128/stream.mp3" data-name="NDR Kultur">
                            NDR Kultur
                        </button>
                        <button class="station-btn" data-url="http://streams.80s80s.de/nds/mp3-192/streams.80s80s.de/" data-name="80s80s NDS">
                            80s80s NDS
                        </button>
                    </div>
                </div>

                <div class="player-controls">
                    <div class="current-station">
                        <span class="status-indicator" id="statusIndicator"></span>
                        <span id="currentStation">Sender auswählen</span>
                    </div>
                    
                    <div class="audio-controls">
                        <audio id="audioPlayer" controls preload="none">
                            Ihr Browser unterstützt leider keine HTML5-Audiowiedergabe.
                        </audio>
                    </div>

                    <div class="volume-control">
                        <label for="volumeSlider">🔊 Lautstärke</label>
                        <input type="range" id="volumeSlider" min="0" max="100" value="50">
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <p>&copy; 2025 Oidarwave. Alle Rechte vorbehalten. | Webradio für jeden Geschmack</p>
        </footer>
    </div>

    <script>
        let currentAudio = null;
        let currentStation = null;

        const stationButtons = document.querySelectorAll('.station-btn');
        const audioPlayer = document.getElementById('audioPlayer');
        const currentStationDisplay = document.getElementById('currentStation');
        const volumeSlider = document.getElementById('volumeSlider');
        const statusIndicator = document.getElementById('statusIndicator');

        audioPlayer.volume = 0.5;

        stationButtons.forEach(button => {
            button.addEventListener('click', () => {
                selectStation(button);
            });
        });

        function selectStation(button) {
            stationButtons.forEach(btn => btn.classList.remove('active'));
            
            button.classList.add('active');
            
            const url = button.dataset.url;
            const name = button.dataset.name;
            
            currentStationDisplay.textContent = name;
            currentStation = name;
            
            audioPlayer.src = url;
            audioPlayer.load();
            
            updateStatus('loading');
        }

        volumeSlider.addEventListener('input', (e) => {
            audioPlayer.volume = e.target.value / 100;
        });

        audioPlayer.addEventListener('loadstart', () => {
            updateStatus('loading');
        });

        audioPlayer.addEventListener('canplay', () => {
            if (currentStation) {
                 audioPlayer.play().catch(e => console.error("Autoplay-Fehler:", e));
            }
            updateStatus('ready');
        });

        audioPlayer.addEventListener('playing', () => {
            updateStatus('online');
        });

        audioPlayer.addEventListener('pause', () => {
            updateStatus('paused');
        });

        audioPlayer.addEventListener('error', (e) => {
            console.error('Audiofehler:', e);
            updateStatus('offline');
        });

        audioPlayer.addEventListener('stalled', () => {
            updateStatus('buffering');
        });

        audioPlayer.addEventListener('waiting', () => {
            updateStatus('buffering');
        });

        function updateStatus(status) {
            const indicator = statusIndicator;
            indicator.classList.remove('offline');
            
            switch(status) {
                case 'online':
                    indicator.style.background = '#4CAF50';
                    indicator.style.animation = 'pulse-status 2s infinite';
                    indicator.style.boxShadow = '0 0 10px rgba(76, 175, 80, 0.5)';
                    break;
                case 'offline':
                    indicator.classList.add('offline');
                    indicator.style.animation = 'none';
                    indicator.style.boxShadow = '0 0 10px rgba(244, 67, 54, 0.5)';
                    break;
                case 'loading':
                case 'buffering':
                    indicator.style.background = '#FF9800';
                    indicator.style.animation = 'pulse-status 1s infinite';
                    indicator.style.boxShadow = '0 0 10px rgba(255, 152, 0, 0.5)';
                    break;
                case 'ready':
                case 'paused':
                    indicator.style.background = '#2196F3';
                    indicator.style.animation = 'none';
                    indicator.style.boxShadow = '0 0 10px rgba(33, 150, 243, 0.5)';
                    break;
            }
        }

        function checkOnlineStatus() {
            if (navigator.onLine) {
                document.body.classList.remove('offline');
            } else {
                document.body.classList.add('offline');
                updateStatus('offline');
            }
        }

        window.addEventListener('online', checkOnlineStatus);
        window.addEventListener('offline', checkOnlineStatus);
        
        checkOnlineStatus();
        updateStatus('ready');

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName !== 'INPUT') {
                switch(e.code) {
                    case 'Space':
                        e.preventDefault();
                        if (audioPlayer.paused) {
                            audioPlayer.play().catch(console.error);
                        } else {
                            audioPlayer.pause();
                        }
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        volumeSlider.value = Math.min(100, parseInt(volumeSlider.value) + 10);
                        audioPlayer.volume = volumeSlider.value / 100;
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        volumeSlider.value = Math.max(0, parseInt(volumeSlider.value) - 10);
                        audioPlayer.volume = volumeSlider.value / 100;
                        break;
                }
            }
        });

        if (stationButtons.length > 0) {
            selectStation(stationButtons[0]);
        }

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
</body>
</html>
