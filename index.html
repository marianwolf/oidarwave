<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Willkommen – Deine neue Webseite</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="animations.css">
</head>
<body>
  <header>
    <h1>Willkommen auf deiner neuen Webseite!</h1>
  </header>
  <main>
    <section id="webradio">
      <h2>Webradio</h2>
      <div id="webradio-player">
        <label for="radio-station">Sender wählen:</label>
        <select id="radio-station">
          <option value="https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3">Deutschlandfunk</option>
          <option value="https://stream.radioparadise.com/mp3-192">Radio Paradise</option>
          <option value="https://radio.bbg-bew.de">BBG</option>
          <option value="https://radioparadise.com/player/info/main-mix">The Main Mix</option>
        </select>
        <button id="radio-toggle" aria-label="Play" class="icon-btn"></button>
        <audio id="radio-audio" preload="true" autoplay></audio>
      </div>
    </section>
  </main>
  <footer>
    &copy; 2025 Deine neue Webseite
  </footer>
  <script>
    // Webradio-Player Logik
    const radioAudio = document.getElementById('radio-audio');
    const radioToggle = document.getElementById('radio-toggle');
    const radioStation = document.getElementById('radio-station');

    function createRadioIcon(type) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', '28');
      svg.setAttribute('height', '28');
      svg.setAttribute('viewBox', '0 0 40 40');
      if(type === 'play') {
        svg.innerHTML = '<circle cx="20" cy="20" r="20" fill="#1db954"/><polygon points="15,10 32,20 15,30" fill="#fff"/>';
      } else if(type === 'pause') {
        svg.innerHTML = '<circle cx="20" cy="20" r="20" fill="#f1c40f"/><rect x="13" y="10" width="5" height="20" rx="2" fill="#fff"/><rect x="22" y="10" width="5" height="20" rx="2" fill="#fff"/>';
      }
      return svg;
    }
    function showRadioPlay() {
      radioToggle.innerHTML = '';
      radioToggle.appendChild(createRadioIcon('play'));
      radioToggle.setAttribute('aria-label', 'Play');
    }
    function showRadioPause() {
      radioToggle.innerHTML = '';
      radioToggle.appendChild(createRadioIcon('pause'));
      radioToggle.setAttribute('aria-label', 'Pause');
    }
    // Initialisiere mit Play-Icon
    showRadioPlay();
    // Play/Pause-Logik
    radioToggle.onclick = function() {
      const selectedSrc = radioStation.value;
      if(radioAudio.paused) {
        if(radioAudio.src !== selectedSrc) {
          radioAudio.src = selectedSrc;
          radioAudio.load();
        }
        radioAudio.volume = 1.0;
        radioAudio.play();
      } else {
        radioAudio.pause();
        radioAudio.currentTime = 0;
      }
    };
    // Senderwechsel pausiert und setzt den Stream zurück
    radioStation.addEventListener('change', () => {
      radioAudio.pause();
      radioAudio.currentTime = 0;
      showRadioPlay();
    });
    // Icon-Status synchronisieren
    radioAudio.addEventListener('play', showRadioPause);
    radioAudio.addEventListener('pause', showRadioPlay);
  </script>
</body>
</html>
