<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="description" content="Oidarwave – Dein modernes Webradio mit Zugriff auf verschiedene Radiosender wie Radio Paradise, BBG, Deutschlandfunk und NDR">
  <meta name="keywords" content="webradio, radio, streaming, musik, deutschlandfunk, ndr">
  <meta name="author" content="Oidarwave">
  <meta property="og:title" content="Oidarwave">
  <meta property="og:description" content="Oidarwave – Dein modernes Webradio mit Zugriff auf verschiedene Radiosender wie Radio Paradise, BBG, Deutschlandfunk und NDR">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/images/og-image.jpg">
  <meta property="og:url" content="https://oidarwave.de">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Oidarwave">
  <meta name="twitter:description" content="Dein Webradio mit Zugriff auf verschiedene Radiosender">
  <meta name="twitter:image" content="/images/twitter-card.jpg">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/images/icon-192.png">
  <link rel="preload" href="style.css" as="style">
  <link rel="preload" href="animations.css" as="style">
  <link rel="preload" href="script.js" as="script">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://stream.radioparadise.com">
  <link rel="dns-prefetch" href="https://radio.bbg-bew.de">
  <title>Oidarwave</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="animations.css">
</head>
<body>
  <header>
    <div>
      <h1>Oidarwave</h1>
    </div>
    <nav>
      </button>
      <div id="main-menu" class="nav-menu">
        <a href="#webradio" class="nav-link">Radio</a>
        <a href="contact.html" class="nav-link">Kontakt</a>
        <a href="about.html" class="nav-link">Impressum</a>
        <a href="datenschutz.html" class="nav-link">Datenschutz</a>
      </div>
    </nav>
  </header>
  <main id="main-content" class="site-main">
    <section id="webradio" class="radio-section" aria-labelledby="radio-heading">
      <h2 id="radio-heading" class="section-title">Webradio</h2>
      
      <div id="webradio-player" class="radio-player" aria-label="Webradio Player">
        <div class="station-select">
          <label for="radio-station" class="radio-label">Sender wählen:</label>
          <select id="radio-station" class="station-dropdown" aria-label="Radiosender auswählen">
            <optgroup label="Internationale Sender">
              <option value="https://stream.radioparadise.com/mp3-192">Radio Paradise</option>
            </optgroup>
            <optgroup label="Lokale Sender">
              <option value="https://radio.bbg-bew.de">BBG</option>
            </optgroup>
            <optgroup label="Öffentlich-Rechtliche">
              <option value="https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3?aggregator=web">Deutschlandfunk</option>
              <option value="https://st02.sslstream.dlf.de/dlf/02/128/mp3/stream.mp3?aggregator=web">Deutschlandfunk Kultur</option>
              <option value="https://st03.sslstream.dlf.de/dlf/03/128/mp3/stream.mp3?aggregator=web">Deutschlandfunk Nova</option>
              <option value="https://f141.rndfnk.com/ard/ndr/ndr1niedersachsen/hannover/mp3/128/stream.mp3">NDR 1</option>
              <option value="https://d141.rndfnk.com/ard/ndr/ndrinfo/niedersachsen/mp3/128/stream.mp3">NDR Info</option>
              <option value="https://f131.rndfnk.com/ard/ndr/ndr2/niedersachsen/mp3/128/stream.mp3">NDR 2</option>
              <option value="https://f111.rndfnk.com/ard/ndr/ndrkultur/live/mp3/128/stream.mp3">NDR Kultur</option>
            </optgroup>
            <optgroup label="Musiksender">
              <option value="https://regiocast.streamabc.net/regc-80s80snds-mp3-192-1969206">80s80s NDS</option>
            </optgroup>
          </select>
        </div>
        
        <div class="radio-controls" role="group" aria-label="Radioplayer Steuerung">
          <button id="radio-toggle" 
                  class="icon-btn play-btn" 
                  aria-label="Wiedergabe"
                  data-action="play">
          </button>
          
          <button id="radio-pause" 
                  class="icon-btn pause-btn" 
                  aria-label="Pause"
                  data-action="pause">
          </button>
          
          <button id="radio-stop" 
                  class="icon-btn stop-btn" 
                  aria-label="Stop"
                  data-action="stop">
          </button>
          
          <span id="radio-time" 
                class="time-display" 
                role="timer" 
                aria-label="Wiedergabezeit">00:00</span>
        </div>
        
        <audio id="radio-audio" 
               preload="metadata" 
               aria-hidden="true">
          <p>Ihr Browser unterstützt leider keine HTML5-Audiowiedergabe.</p>
        </audio>
        
        <div id="radio-status" 
             class="status-message hidden" 
             role="status" 
             aria-live="polite">
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer" role="contentinfo">
    <div class="footer-content">
      <p class="copyright">&copy; 2025 Oidarwave</p>
      <nav class="footer-nav" aria-label="Footer Navigation">
        <ul class="footer-links">
          <li><a href="/datenschutz.html">Datenschutz</a></li>
          <li><a href="/impressum.html">Impressum</a></li>
        </ul>
      </nav>
    </div>
  </footer>

  <!-- Structured Data für bessere SEO -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Oidarwave",
      "applicationCategory": "Multimedia, Radio",
      "offers": {
        "@type": "Offer",
        "price": "0"
      }
    }
  </script>

  <!-- Performance Optimierung: Skripte am Ende -->
  <script src="script.js" defer></script>
  <script src="/_vercel/speed-insights/script.js" defer async></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('ServiceWorker registration successful');
          })
          .catch(err => {
            console.error('ServiceWorker registration failed:', err);
          });
      });
    }
  </script>

  <!-- Offline Support Benachrichtigung -->
  <div id="offline-notification" 
       class="notification hidden" 
       role="alert" 
       aria-live="polite">
    Sie sind offline. Einige Funktionen sind möglicherweise eingeschränkt.
  </div>
</body>
</html>
