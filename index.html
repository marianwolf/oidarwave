<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Willkommen – Deine neue Webseite</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="animations.css">
  <style>
    /* Allgemeine Stile für Hamburger-Menü und Toggle */
    #hamburger-toggle {
      background: none;
      border: none;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      padding: 0;
      /* Optional: Für bessere Zugänglichkeit */
      touch-action: manipulation;
    }

    #hamburger-toggle .hamburger-bar {
      width: 30px;
      height: 4px;
      background-color: #333;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    /* Stil für das Flyout-Menü */
    .flyout-nav {
      list-style: none;
      margin: 0;
      padding: 0;
      display: none; /* Standardmäßig ausgeblendet */
      background: #f9f9f9;
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      position: absolute;
      top: 60px; /* Anpassen an deine Layout-Bedürfnisse */
      right: 20px; /* Anpassen an deine Layout-Bedürfnisse */
      z-index: 1000;
    }

    .flyout-nav li {
      padding: 10px 20px;
      /* Optional: Trennlinien zwischen Menüpunkten */
      /* border-bottom: 1px solid #eee; */
    }

    /* Letztes Element ohne Trennlinie */
    /* .flyout-nav li:last-child {
      border-bottom: none;
    } */

    .flyout-nav li a {
      text-decoration: none;
      color: #333;
      display: block; /* Damit der ganze Bereich klickbar ist */
    }

    .flyout-nav li a:hover,
    .flyout-nav li a:focus { /* Auch für Tastatur-Fokus */
      color: #007BFF;
    }

    /* Additional styles for radio buttons to match select height */
    :root {
      --radio-btn-size: 44px; /* Default value */
    }
    .icon-btn {
      width: var(--radio-btn-size);
      height: var(--radio-btn-size);
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="headline-de">Willkommen auf deiner neuen Webseite!</h1>
      <h1 id="headline-en" style="display:none">Welcome to your new website!</h1>
    </div>
    <nav>
      <button id="lang-toggle" aria-label="Sprache umschalten">DE/EN</button>
      <button id="menu-toggle" aria-label="Menü öffnen" aria-expanded="false">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <ul id="main-menu" class="flyout-nav" style="display: none;">
        <li><a href="#webradio">Webradio</a></li>
        <li><a href="about.html">Über / About</a></li>
        <li><a href="contact.html">Kontakt / Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section id="webradio">
      <h2 id="radio-title-de">Webradio</h2>
      <h2 id="radio-title-en" style="display:none">Web Radio</h2>
      <div id="webradio-player">
        <label for="radio-station" class="radio-label" id="label-de">Sender wählen:</label>
        <label for="radio-station" class="radio-label" id="label-en" style="display:none">Choose station:</label>
        <select id="radio-station">
          <option value="https://stream.radioparadise.com/mp3-192">Radio Paradise</option>
          <option value="https://radio.bbg-bew.de">BBG</option>
          <option value="https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3?aggregator=web">Deutschlandfunk</option>
          <option value="https://st02.sslstream.dlf.de/dlf/02/128/mp3/stream.mp3?aggregator=web">Deutschlandfunk Kultur</option>
          <option value="https://st03.sslstream.dlf.de/dlf/03/128/mp3/stream.mp3?aggregator=web">Deutschlandfunk Nova</option>
          <option value="http://uk3.internet-radio.com:8405/live">Jazz</option>
          <option value="https://regiocast.streamabc.net/regc-80s80snds-mp3-192-1969206?sABC=686n6324%231%23r2ps3905q0or49psops1388p88o9n35s%23ubzrcntr&mode=preroll&aw_0_1st.skey=1751802638&cb=249580652&aw_0_req.userConsentV2=CQUIV0AQUIV0AAFADBDEByFgAAAAAAAAAAYgAAASIgNAAEAAyACWAE4AUQAsAC0AIwATgAogBugDkAOYAgwBGACuAGaANUAiYBLQDPgHAAP2AioBGwC3gGAAPeAkQAWGgAwABBIgRABgACCRAqADAAEEiBkAGAAIJEAoAMAAQSICQAYAAgkQOgAwABBIghABgACCRBKADAAEEiCkAGAAIJEFoAMAAQSI.YAAAAAAAAAAA&aw_0_1st.playerid=80s80s_web&listenerid=e2cf3905d0be49cfbcf1388c88b9a35f&amsparams=playerid:homepage;skey:1751802660">80s80s NDS</option>
        </select>
        <button id="radio-toggle" aria-label="Play" class="icon-btn">
          </button>
        <button id="radio-pause" aria-label="Pause" class="icon-btn" style="display: none;">
          </button>
        <button id="radio-stop" aria-label="Stop" class="icon-btn" style="display: none;">
          </button>
        <span id="radio-time">00:00</span>
        <audio id="radio-audio" preload="true"></audio> </div>
    </section>
  </main>
  <footer>
    <span id="footer-de">&copy; 2025 Deine neue Webseite</span>
    <span id="footer-en" style="display:none">&copy; 2025 Your new website</span>
  </footer>
  <script>
    // Sprachumschaltung
    const langToggle = document.getElementById('lang-toggle');
    let lang = 'de';

    if (langToggle) {
      langToggle.onclick = function() {
        lang = lang === 'de' ? 'en' : 'de';
        document.getElementById('headline-de').style.display = lang === 'de' ? '' : 'none';
        document.getElementById('headline-en').style.display = lang === 'en' ? '' : 'none';
        document.getElementById('radio-title-de').style.display = lang === 'de' ? '' : 'none';
        document.getElementById('radio-title-en').style.display = lang === 'en' ? '' : 'none';
        document.getElementById('label-de').style.display = lang === 'de' ? '' : 'none';
        document.getElementById('label-en').style.display = lang === 'en' ? '' : 'none';
        document.getElementById('footer-de').style.display = lang === 'de' ? '' : 'none';
        document.getElementById('footer-en').style.display = lang === 'en' ? '' : 'none';
      };
    }

    // Webradio-Player Logik
    const radioAudio = document.getElementById('radio-audio'); // Reference existing audio element
    const radioToggle = document.getElementById('radio-toggle');
    const radioPause = document.getElementById('radio-pause');
    const radioStop = document.getElementById('radio-stop');
    const radioStation = document.getElementById('radio-station');
    const radioTime = document.getElementById('radio-time');

    let timeInterval = null;
    let streamStartTimestamp = null;
    let pausedAt = null;

    // Helper to get CSS variables
    function getCSSVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    // Function to create SVG icons for radio buttons
    function createRadioIcon(type) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      // Use CSS variable for button size for width/height
      const btnSize = parseFloat(getCSSVar('--radio-btn-size')) || 44;
      svg.setAttribute('width', btnSize);
      svg.setAttribute('height', btnSize);
      svg.setAttribute('viewBox', '0 0 40 40');

      const colorPlay = getCSSVar('--primary') || '#1db954';
      const colorPause = getCSSVar('--accent-yellow') || '#f1c40f';
      const colorStop = getCSSVar('--accent-red') || '#e74c3c';

      if (type === 'play') {
        svg.innerHTML = `<circle cx="20" cy="20" r="20" fill="${colorPlay}"/><polygon points="15,10 32,20 15,30" fill="#fff"/>`;
      } else if (type === 'pause') {
        svg.innerHTML = `<circle cx="20" cy="20" r="20" fill="${colorPause}"/><rect x="13" y="10" width="5" height="20" rx="2" fill="#fff"/><rect x="22" y="10" width="5" height="20" rx="2" fill="#fff"/>`;
      } else if (type === 'stop') {
        svg.innerHTML = `<circle cx="20" cy="20" r="20" fill="${colorStop}"/><rect x="10" y="10" width="20" height="20" rx="5" fill="#fff"/>`;
      }
      return svg;
    }

    // Functions to manage button visibility and icons
    function showRadioPlay() {
      if (radioToggle) {
        radioToggle.style.display = '';
        radioToggle.innerHTML = '';
        radioToggle.appendChild(createRadioIcon('play'));
        radioToggle.setAttribute('aria-label', 'Play');
      }
      if (radioPause) radioPause.style.display = 'none';
      if (radioStop) radioStop.style.display = 'none';
    }

    function showRadioPauseStop() {
      if (radioToggle) radioToggle.style.display = 'none';
      if (radioPause) {
        radioPause.style.display = '';
        radioPause.innerHTML = '';
        radioPause.appendChild(createRadioIcon('pause'));
        radioPause.setAttribute('aria-label', 'Pause');
      }
      if (radioStop) {
        radioStop.style.display = '';
        radioStop.innerHTML = '';
        radioStop.appendChild(createRadioIcon('stop'));
        radioStop.setAttribute('aria-label', 'Stop');
      }
    }

    function showRadioPlayStop() {
      if (radioToggle) {
        radioToggle.style.display = '';
        radioToggle.innerHTML = '';
        radioToggle.appendChild(createRadioIcon('play'));
        radioToggle.setAttribute('aria-label', 'Play');
      }
      if (radioPause) radioPause.style.display = 'none';
      if (radioStop) {
        radioStop.style.display = '';
        radioStop.innerHTML = '';
        radioStop.appendChild(createRadioIcon('stop'));
        radioStop.setAttribute('aria-label', 'Stop');
      }
    }

    // Functions for radio timer
    function updateRadioTime() {
      if (streamStartTimestamp !== null) {
        let elapsed;
        if (pausedAt !== null) {
          elapsed = pausedAt - streamStartTimestamp;
        } else {
          elapsed = Date.now() - streamStartTimestamp;
        }
        elapsed = Math.floor(elapsed / 1000);
        const min = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const sec = String(elapsed % 60).padStart(2, '0');
        if (radioTime) radioTime.textContent = `${min}:${sec}`;
      } else {
        if (radioTime) radioTime.textContent = '00:00';
      }
    }

    function startRadioTimer() {
      if (streamStartTimestamp === null) streamStartTimestamp = Date.now();
      pausedAt = null;
      updateRadioTime();
      if (timeInterval) clearInterval(timeInterval);
      timeInterval = setInterval(updateRadioTime, 500);
    }

    function stopRadioTimer(reset = true) {
      if (timeInterval) clearInterval(timeInterval);
      if (reset) {
        if (radioTime) radioTime.textContent = '00:00';
        streamStartTimestamp = null;
        pausedAt = null;
      }
    }

    // Initial setup for radio UI
    function initRadioUI() {
      stopRadioTimer();
      showRadioPlay();
    }

    // Event Listeners for Radio Player
    if (radioToggle) {
      radioToggle.onclick = function() {
        const selectedSrc = radioStation.value;
        if (radioAudio.src !== selectedSrc) {
          radioAudio.src = selectedSrc;
          radioAudio.load();
        }
        radioAudio.volume = 1.0;
        radioAudio.play();
        // showRadioPauseStop() will be called by 'play' event listener
      };
    }

    if (radioPause) {
      radioPause.onclick = function() {
        radioAudio.pause();
        // showRadioPlayStop() will be called by 'pause' event listener
      };
    }

    if (radioStop) {
      radioStop.onclick = function() {
        radioAudio.pause();
        radioAudio.removeAttribute('src');
        radioAudio.load();
        stopRadioTimer();
        showRadioPlay(); // Reset to play button state
      };
    }

    if (radioStation) {
      radioStation.addEventListener('change', () => {
        radioAudio.pause();
        radioAudio.removeAttribute('src');
        radioAudio.load();
        stopRadioTimer();
        showRadioPlay(); // Reset to play button state
      });
    }

    // Icon-Status synchronisieren bei Audio-Events
    radioAudio.addEventListener('play', () => {
      showRadioPauseStop();
      if (streamStartTimestamp === null) streamStartTimestamp = Date.now();
      if (pausedAt !== null) {
        streamStartTimestamp += (Date.now() - pausedAt);
        pausedAt = null;
      }
      startRadioTimer();
    });

    radioAudio.addEventListener('pause', () => {
      if (!radioAudio.src || radioAudio.currentTime === 0) {
        showRadioPlay(); // If completely stopped or no source
        stopRadioTimer();
      } else {
        showRadioPlayStop(); // If just paused
        if (streamStartTimestamp !== null) pausedAt = Date.now();
        stopRadioTimer(false); // Do not reset timer, just pause updates
      }
    });

    radioAudio.addEventListener('ended', () => {
      stopRadioTimer();
      showRadioPlay(); // Reset to play button state
    });

    // --- Buttons exakt an Select-Höhe anpassen ---
    function setRadioBtnSize() {
      const select = document.getElementById('radio-station');
      if (!select) return;

      const rect = select.getBoundingClientRect();
      const computed = window.getComputedStyle(select);
      let height = rect.height;

      if (height < 10) height = parseFloat(computed.height);
      height = Math.max(44, Math.min(height, 100)); // Ensure sensible height
      document.documentElement.style.setProperty('--radio-btn-size', `${height}px`);
    }

    // Call size adjustment on load, resize, and after a slight delay for rendering
    window.addEventListener('DOMContentLoaded', setRadioBtnSize);
    window.addEventListener('resize', setRadioBtnSize);
    setTimeout(setRadioBtnSize, 100);

    // Performance-Optimierung: Mousemove-Handler throttlen
    const section = document.querySelector('section');
    if (section) {
      let animFrame = null;
      section.addEventListener('mousemove', e => {
        if (animFrame) return;
        animFrame = requestAnimationFrame(() => {
          // You can perform DOM manipulations here based on the mouse event
          animFrame = null;
        });
      });
    }

    // Deployment-Optimierung: Service Worker für Offline-Support (optional)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch((error) => {
          console.error('Service Worker Registration failed:', error);
        });
      });
    }

    // Space-Taste steuert Play/Pause (außer bei Fokus auf Input/Select)
    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space' || e.key === ' ') {
        const active = document.activeElement;
        if (active && (active.tagName === 'INPUT' || active.tagName === 'SELECT' || active.isContentEditable)) {
          return;
        }
        e.preventDefault(); // Prevent default space bar behavior (e.g., scrolling)

        if (radioAudio.paused) {
          if (radioToggle) radioToggle.click();
        } else {
          if (radioPause) radioPause.click();
        }
      }
    });

    // Menü-Logik (unified with hamburger menu)
    const menuToggle = document.getElementById('menu-toggle');
    const mainMenu = document.getElementById('main-menu');
    let menuOpen = false;

    if (menuToggle && mainMenu) {
      menuToggle.onclick = function() {
        menuOpen = !menuOpen;
        mainMenu.style.display = menuOpen ? 'block' : 'none';
        menuToggle.setAttribute('aria-expanded', menuOpen.toString());
      };

      document.addEventListener('click', function(e) {
        if (menuOpen && !mainMenu.contains(e.target) && e.target !== menuToggle) {
          mainMenu.style.display = 'none';
          menuToggle.setAttribute('aria-expanded', 'false');
          menuOpen = false;
        }
      });

      // Tastatursteuerung für Menü
      menuToggle.addEventListener('keydown', function(e) {
        if ((e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') && !menuOpen) {
          e.preventDefault();
          menuToggle.click();
          const firstMenuItem = mainMenu.querySelector('a');
          if (firstMenuItem) {
            firstMenuItem.focus();
          }
        }
      });

      mainMenu.addEventListener('keydown', function(e) {
        const items = Array.from(mainMenu.querySelectorAll('a'));
        let idx = items.indexOf(document.activeElement);

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          items[(idx + 1) % items.length].focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          items[(idx - 1 + items.length) % items.length].focus();
        } else if (e.key === 'Escape') {
          menuToggle.click();
          menuToggle.focus();
        }
      });
    }

    // Call initRadioUI after all functions are defined
    document.addEventListener('DOMContentLoaded', initRadioUI);
  </script>
</body>
</html>
