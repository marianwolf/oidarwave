<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meine einfache Webseite</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    header {
      background-color: #3498db;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
    }
    main {
      margin-top: 20px;
    }
    section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    footer {
      margin-top: 20px;
      text-align: center;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <h1>Willkommen auf meiner Webseite</h1>
  </header>

  <main>
    <section>
      <h2>Über mich</h2>
      <p>Hallo! Das ist eine einfache Webseite mit HTML und CSS. Du kannst sie beliebig erweitern.</p>
    </section>

    <section>
      <h2>Kontakt</h2>
      <p>Schreib mir eine Mail: <a href="mailto:example@example.com">example@example.com</a></p>
    </section>
  </main>

  <footer>
    &copy; 2025 Meine Webseite
  </footer>
</body>
</html>
