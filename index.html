<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meine einfache Webseite</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="animations.css">
</head>
<body>
  <header>
    <h1>Welcome to my website</h1>
  </header>

  <main>
    <section>
      <h2>About me</h2>
      <p>Hello! This is a simple website with HTML and CSS. You can extend it as you like.</p>
    </section>
    <section>
      <h2>Contact</h2>
      <p>Send me an email: <a href="mailto:example@example.com">example@example.com</a></p>
    </section>
    <section style="display: flex; align-items: center; justify-content: center; flex-direction: column;">
      <button id="play-btn" aria-label="Play" style="background: linear-gradient(135deg, #1db954 60%, #1ed760 100%); border: none; border-radius: 50%; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 24px rgba(30,185,84,0.25), 0 2px 8px rgba(0,0,0,0.2); cursor: pointer; transition: background 0.2s, transform 0.1s; margin-bottom: 18px; position: relative; outline: none; z-index:2;">
        <span style="position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
          <svg id="play-icon" width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" style="position:absolute;left:0;top:0;">
            <circle cx="20" cy="20" r="20" fill="#1db954"/>
            <polygon points="17,13 29,20 17,27" fill="#fff"/>
          </svg>
          <svg id="pause-icon" width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" style="display:none;position:absolute;left:0;top:0;">
            <circle cx="20" cy="20" r="20" fill="#1db954"/>
            <rect x="15" y="13" width="4" height="14" fill="#fff" rx="1.5"/>
            <rect x="23" y="13" width="4" height="14" fill="#fff" rx="1.5"/>
          </svg>
        </span>
      </button>
      <span style="color: var(--muted); font-size: 1.1rem;">Play</span>
      <div id="track-title" style="color: var(--muted); font-size:1rem;margin-top:10px;min-height:24px;text-align:center;"></div>
    </section>
  </main>

  <footer>
    &copy; 2025 My Website
  </footer>
  <button id="theme-toggle" aria-label="Toggle light/dark mode" style="position:fixed;top:16px;right:16px;z-index:10;background:var(--background);color:var(--primary);border:2px solid var(--primary);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 0.3s;">
    <span id="theme-icon" aria-hidden="true" style="font-size:1.5rem;">🌙</span>
  </button>

  <script>
    // Theme Toggle
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    function setTheme(mode) {
      document.body.setAttribute('data-theme', mode);
      if(mode === 'light') {
        themeIcon.textContent = '☀️';
      } else {
        themeIcon.textContent = '🌙';
      }
    }
    themeToggle.addEventListener('click', () => {
      const current = document.body.getAttribute('data-theme');
      setTheme(current === 'light' ? 'dark' : 'light');
    });
    // Initial Theme
    if(window.matchMedia('(prefers-color-scheme: light)').matches) {
      setTheme('light');
    } else {
      setTheme('dark');
    }

    // Track-Infos für Titelanzeige und Previews
    const trackInfos = [
      { id: '3n3Ppam7vgaVa1iaRUc9Lp', title: 'Red Hot Chili Peppers - Californication', preview: 'https://p.scdn.co/mp3-preview/6c5e3e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e?cid=774b29d4f13844c495f206cafdad9c86' },
      { id: '7ouMYWpwJ422jRcDASZB7P', title: 'Daft Punk - One More Time', preview: 'https://p.scdn.co/mp3-preview/2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b?cid=774b29d4f13844c495f206cafdad9c86' },
      { id: '1lDWb6b6ieDQ2xT7ewTC3G', title: 'Avicii - Wake Me Up', preview: 'https://p.scdn.co/mp3-preview/6d6e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e?cid=774b29d4f13844c495f206cafdad9c86' },
      { id: '0VjIjW4GlUZAMYd2vXMi3b', title: 'The Weeknd - Blinding Lights', preview: 'https://p.scdn.co/mp3-preview/6b6b6b6b6b6b6b6b6b6b6b6b6b6b6b6b6b6b6b6b?cid=774b29d4f13844c495f206cafdad9c86' },
      { id: '6habFhsOp2NvshLv26DqMb', title: 'Dua Lipa - New Rules', preview: 'https://p.scdn.co/mp3-preview/6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a?cid=774b29d4f13844c495f206cafdad9c86' }
    ];

    let isPlaying = false;
    let currentTrack = null;
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const audio = document.getElementById('spotify-audio');
    const trackTitle = document.getElementById('track-title');

    function playRandomTrack() {
      const random = Math.floor(Math.random() * trackInfos.length);
      const track = trackInfos[random];
      if (track.preview) {
        audio.src = track.preview;
        audio.load();
        setTimeout(() => {
          audio.play().catch(() => {
            trackTitle.textContent = 'Autoplay nicht möglich. Bitte Play im Player drücken.';
          });
        }, 100);
        trackTitle.textContent = track.title;
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
        isPlaying = true;
        currentTrack = track;
      } else {
        trackTitle.textContent = '';
        alert('Für diesen Song ist keine Vorschau verfügbar.');
      }
    }

    playBtn.addEventListener('click', function() {
      if (!isPlaying) {
        playRandomTrack();
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', function() {
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      isPlaying = true;
    });
    audio.addEventListener('pause', function() {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      isPlaying = false;
    });
    audio.addEventListener('ended', function() {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      isPlaying = false;
    });
  </script>
</body>
</html>
