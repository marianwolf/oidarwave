<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Willkommen – Deine neue Webseite</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="animations.css">
</head>
<body>
  <header>
    <div>
      <h1 id="headline-de">Willkommen auf deiner neuen Webseite!</h1>
      <h1 id="headline-en" style="display:none">Welcome to your new website!</h1>
    </div>
    <nav>
      <!-- Hamburger-Menü -->
      <button id="hamburger-toggle" aria-label="Menü öffnen" aria-expanded="false">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <ul id="hamburger-menu" class="flyout-nav" style="display: none;">
            <li><a href="#webradio">Webradio</a></li>
            <li><a href="about.html">Über / About</a></li>
            <li><a href="contact.html">Kontakt / Contact</a></li>
          </ul>
    </nav>
  </header>
  <main>
    <section id="webradio">
      <h2 id="radio-title-de">Webradio</h2>
      <h2 id="radio-title-en" style="display:none">Web Radio</h2>
      <div id="webradio-player">
        <label for="radio-station" class="radio-label" id="label-de">Sender wählen:</label>
        <label for="radio-station" class="radio-label" id="label-en" style="display:none">Choose station:</label>
        <select id="radio-station">
          <option value="https://stream.radioparadise.com/mp3-192">Radio Paradise</option>
          <option value="https://radio.bbg-bew.de">BBG</option>
          <option value="https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3?aggregator=web">Deutschlandfunk</option>
          <option value="https://st02.sslstream.dlf.de/dlf/02/128/mp3/stream.mp3?aggregator=web">Deutschlandfunk Kultur</option>
          <option value="https://st03.sslstream.dlf.de/dlf/03/128/mp3/stream.mp3?aggregator=web">Deutschlandfunk Nova</option>
          <option value="http://uk3.internet-radio.com:8405/live">Jazz</option>
          <option value="https://regiocast.streamabc.net/regc-80s80snds-mp3-192-1969206?sABC=686n6324%231%23r2ps3905q0or49psops1388p88o9n35s%23ubzrcntr&mode=preroll&aw_0_1st.skey=1751802638&cb=249580652&aw_0_req.userConsentV2=CQUIV0AQUIV0AAFADBDEByFgAAAAAAAAAAYgAAASIgNAAEAAyACWAE4AUQAsAC0AIwATgAogBugDkAOYAgwBGACuAGaANUAiYBLQDPgHAAP2AioBGoC3gGAAPeAkQAWGgAwABBIgRABgACCRAqADAAEEiBkAGAAIJEAoAMAAQSICQAYAAgkQOgAwABBIghABgACCRBKADAAEEiCkAGAAIJEFoAMAAQSI.YAAAAAAAAAAA&aw_0_1st.playerid=80s80s_web&listenerid=e2cf3905d0be49cfbcf1388c88b9a35f&amsparams=playerid:homepage;skey:1751802660">80s80s NDS</option>
        </select>
        <button id="radio-toggle" aria-label="Play" class="icon-btn">
          <!-- Icon wird per JS gesetzt -->
        </button>
        <button id="radio-pause" aria-label="Pause" class="icon-btn">
          <!-- Icon wird per JS gesetzt -->
        </button>
        <button id="radio-stop" aria-label="Stop" class="icon-btn">
          <!-- Icon wird per JS gesetzt -->
        </button>
        <span id="radio-time">00:00</span>
        <audio id="radio-audio" preload="true" autoplay></audio>
      </div>
    </section>
  </main>
  <footer>
    <span id="footer-de">&copy; 2025 Deine neue Webseite</span>
    <span id="footer-en" style="display:none">&copy; 2025 Your new website</span>
  </footer>
  <script>
    // Sprachumschaltung
    const langToggle = document.getElementById('lang-toggle');
    let lang = 'de';
    langToggle.onclick = function() {
      lang = lang === 'de' ? 'en' : 'de';
      document.getElementById('headline-de').style.display = lang === 'de' ? '' : 'none';
      document.getElementById('headline-en').style.display = lang === 'en' ? '' : 'none';
      document.getElementById('radio-title-de').style.display = lang === 'de' ? '' : 'none';
      document.getElementById('radio-title-en').style.display = lang === 'en' ? '' : 'none';
      document.getElementById('label-de').style.display = lang === 'de' ? '' : 'none';
      document.getElementById('label-en').style.display = lang === 'en' ? '' : 'none';
      document.getElementById('footer-de').style.display = lang === 'de' ? '' : 'none';
      document.getElementById('footer-en').style.display = lang === 'en' ? '' : 'none';
    };
    // Webradio-Player Logik
    const radioAudio = document.getElementById('radio-audio');
    const radioToggle = document.getElementById('radio-toggle');
    const radioStation = document.getElementById('radio-station');
    function getCSSVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }
    function createRadioIcon(type) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', '44');
      svg.setAttribute('height', '44');
      svg.setAttribute('viewBox', '0 0 40 40');
      const colorPlay = getCSSVar('--primary') || '#1db954';
      const colorPause = getCSSVar('--accent-yellow') || '#f1c40f';
      const colorStop = getCSSVar('--accent-red') || '#e74c3c';
      if(type === 'play') {
        svg.innerHTML = `<circle cx="20" cy="20" r="20" fill="${colorPlay}"/><polygon points="15,10 32,20 15,30" fill="#fff"/>`;
      } else if(type === 'pause') {
        svg.innerHTML = `<circle cx="20" cy="20" r="20" fill="${colorPause}"/><rect x="13" y="10" width="5" height="20" rx="2" fill="#fff"/><rect x="22" y="10" width="5" height="20" rx="2" fill="#fff"/>`;
      } else if(type === 'stop') {
        svg.innerHTML = `<circle cx="20" cy="20" r="20" fill="${colorStop}"/><rect x="10" y="10" width="20" height="20" rx="5" fill="#fff"/>`;
      }
      return svg;
    }
    function showRadioPlay() {
      radioToggle.style.display = '';
      radioPause.style.display = 'none';
      radioStop.style.display = 'none';
      radioToggle.innerHTML = '';
      radioToggle.appendChild(createRadioIcon('play'));
      radioToggle.setAttribute('aria-label', 'Play');
    }
    function showRadioPauseStop() {
      radioToggle.style.display = 'none';
      radioPause.style.display = '';
      radioStop.style.display = '';
      radioPause.innerHTML = '';
      radioPause.appendChild(createRadioIcon('pause'));
      radioPause.setAttribute('aria-label', 'Pause');
      radioStop.innerHTML = '';
      radioStop.appendChild(createRadioIcon('stop'));
      radioStop.setAttribute('aria-label', 'Stop');
    }
    function showRadioPlayStop() {
      radioToggle.style.display = '';
      radioPause.style.display = 'none';
      radioStop.style.display = '';
      radioToggle.innerHTML = '';
      radioToggle.appendChild(createRadioIcon('play'));
      radioToggle.setAttribute('aria-label', 'Play');
      radioStop.innerHTML = '';
      radioStop.appendChild(createRadioIcon('stop'));
      radioStop.setAttribute('aria-label', 'Stop');
    }
    // Initialisiere mit Play-Icon
    const radioPause = document.getElementById('radio-pause');
    const radioStop = document.getElementById('radio-stop');
    const radioTime = document.getElementById('radio-time');
    let timeInterval = null;
    let streamStartTimestamp = null;
    let pausedAt = null;
    function updateRadioTime() {
      if (streamStartTimestamp !== null) {
        let elapsed;
        if (pausedAt !== null) {
          elapsed = pausedAt - streamStartTimestamp;
        } else {
          elapsed = Date.now() - streamStartTimestamp;
        }
        elapsed = Math.floor(elapsed / 1000);
        const min = String(Math.floor(elapsed/60)).padStart(2,'0');
        const sec = String(elapsed%60).padStart(2,'0');
        radioTime.textContent = `${min}:${sec}`;
      } else {
        radioTime.textContent = '00:00';
      }
    }
    function startRadioTimer() {
      if (streamStartTimestamp === null) streamStartTimestamp = Date.now();
      pausedAt = null;
      updateRadioTime();
      if (timeInterval) clearInterval(timeInterval);
      timeInterval = setInterval(updateRadioTime, 500);
    }
    function stopRadioTimer(reset=true) {
      if (timeInterval) clearInterval(timeInterval);
      if (reset) {
        radioTime.textContent = '00:00';
        streamStartTimestamp = null;
        pausedAt = null;
      }
    }
    function initRadioUI() {
      stopRadioTimer();
      streamStartTimestamp = null;
      pausedAt = null;
      showRadioPlay();
      radioTime.textContent = '00:00';
    }
    initRadioUI();
    // Play-Button
    radioToggle.onclick = function() {
      const selectedSrc = radioStation.value;
      if (!radioAudio.src) {
        radioAudio.src = selectedSrc;
        radioAudio.load();
      }
      radioAudio.volume = 1.0;
      radioAudio.play();
      showRadioPauseStop();
      if (streamStartTimestamp === null) streamStartTimestamp = Date.now();
      if (pausedAt !== null) {
        streamStartTimestamp += (Date.now() - pausedAt);
        pausedAt = null;
      }
      startRadioTimer();
    };
    // Pause-Button
    radioPause.onclick = function() {
      radioAudio.pause();
      showRadioPlayStop();
      if (streamStartTimestamp !== null) pausedAt = Date.now();
      stopRadioTimer(false);
    };
    // Stop-Button
    radioStop.onclick = function() {
      radioAudio.pause();
      radioAudio.removeAttribute('src');
      radioAudio.load();
      showRadioPlay();
      stopRadioTimer();
    };
    // Senderwechsel pausiert und setzt den Stream zurück
    radioStation.addEventListener('change', () => {
      radioAudio.pause();
      radioAudio.removeAttribute('src');
      radioAudio.load();
      showRadioPlay();
      stopRadioTimer();
    });
    // Icon-Status synchronisieren
    radioAudio.addEventListener('play', () => {
      showRadioPauseStop();
      if (streamStartTimestamp === null) streamStartTimestamp = Date.now();
      if (pausedAt !== null) {
        streamStartTimestamp += (Date.now() - pausedAt);
        pausedAt = null;
      }
      startRadioTimer();
    });
    radioAudio.addEventListener('pause', () => {
      if (!radioAudio.src || radioAudio.currentTime === 0) {
        showRadioPlay();
        stopRadioTimer();
      } else {
        showRadioPlayStop();
        if (streamStartTimestamp !== null) pausedAt = Date.now();
        stopRadioTimer(false);
      }
    });
    radioAudio.addEventListener('ended', () => {
      stopRadioTimer();
    });
    // --- Buttons exakt an Select-Höhe anpassen ---
    function setRadioBtnSize() {
      const select = document.getElementById('radio-station');
      if (!select) return;
      const rect = select.getBoundingClientRect();
      const computed = window.getComputedStyle(select);
      let height = rect.height;
      if (height < 10) height = parseFloat(computed.height);
      height = Math.max(44, Math.min(height, 100));
      document.documentElement.style.setProperty('--radio-btn-size', height + 'px');
    }
    window.addEventListener('DOMContentLoaded', setRadioBtnSize);
    window.addEventListener('resize', setRadioBtnSize);
    setTimeout(setRadioBtnSize, 100);
    // Performance-Optimierung: Mousemove-Handler throttlen
    const section = document.querySelector('section');
    if(section) {
      let animFrame;
      section.addEventListener('mousemove', e => {
        if(animFrame) return;
        animFrame = requestAnimationFrame(() => {
          animFrame = null;
        });
      });
    }
    // Deployment-Optimierung: Service Worker für Offline-Support (optional)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
    // Space-Taste steuert Play/Pause (außer bei Fokus auf Input/Select)
    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space' || e.key === ' ') {
        const active = document.activeElement;
        if (active && (active.tagName === 'INPUT' || active.tagName === 'SELECT' || active.isContentEditable)) return;
        e.preventDefault();
        if (radioAudio.paused) {
          radioToggle.click();
        } else {
          radioPause.click();
        }
      }
    });
    // Menü-Logik
    const menuToggle = document.getElementById('menu-toggle');
    const mainMenu = document.getElementById('main-menu');
    let menuOpen = false;
    menuToggle.onclick = function() {
      menuOpen = !menuOpen;
      mainMenu.style.display = menuOpen ? 'block' : 'none';
      menuToggle.setAttribute('aria-expanded', menuOpen);
    };
    document.addEventListener('click', function(e) {
      if (menuOpen && !mainMenu.contains(e.target) && e.target !== menuToggle) {
        mainMenu.style.display = 'none';
        menuToggle.setAttribute('aria-expanded', 'false');
        menuOpen = false;
      }
    });
    // Tastatursteuerung für Menü
    menuToggle.addEventListener('keydown', function(e) {
      if ((e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') && !menuOpen) {
        e.preventDefault();
        menuToggle.click();
        mainMenu.querySelector('a').focus();
      }
    });
    mainMenu.addEventListener('keydown', function(e) {
      const items = Array.from(mainMenu.querySelectorAll('a'));
      let idx = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        items[(idx+1)%items.length].focus();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        items[(idx-1+items.length)%items.length].focus();
      } else if (e.key === 'Escape') {
        menuToggle.click();
        menuToggle.focus();
      }
    });
  </script>
</body>
</html>
