name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.repository == 'langchain-ai/openwiki' || vars.OPENWIKI_ENABLE_SCHEDULED_UPDATE == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Enable Socket Firewall
        uses: socketdev/action@v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenWiki from the checked-out source
        run: pnpm build

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        run: node dist/cli/cli.js code --update --print
        env:
          OPENWIKI_PROVIDER: nvidia
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENWIKI_MODEL_ID: nvidia/nemotron-3.5-lightning-30b-a3b
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_PROJECT: openwiki
          LANGCHAIN_TRACING_V2: 'false'

      - name: Restore protected workflow file
        if: ${{ !cancelled() }}
        run: git checkout -- .github/workflows/openwiki-update.yml

      - name: Remove transient OpenWiki run state
        if: ${{ !cancelled() }}
        run: rm -f -- openwiki/.run.json

      - name: Create OpenWiki update pull request
        id: create-pr
        if: ${{ !cancelled() }}
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: 'docs: update OpenWiki'
          title: 'docs: update OpenWiki'
          body: |
            Automated OpenWiki documentation update.

            OpenWiki result: ${{ steps.openwiki.outcome }}

            When the result is `failure`, this PR intentionally preserves only the
            pages completed before the failure. Merge it to make that progress the
            baseline for the next scheduled run.

      - name: Annotate OpenWiki update pull request
        if: ${{ !cancelled() && steps.create-pr.outputs.pull-request-url != '' }}
        run: echo "::notice title=OpenWiki update pull request::${{ steps.create-pr.outputs.pull-request-url }}"

      - name: Propagate OpenWiki failure
        if: ${{ steps.openwiki.outcome == 'failure' }}
        run: exit 1
