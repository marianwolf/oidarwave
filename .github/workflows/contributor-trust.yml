name: Contributor Trust

on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: contributor-trust-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # Skip for repo members/owners/collaborators
    if: |
      github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' ||
      github.event.pull_request.author_association == 'CONTRIBUTOR' ||
      github.event.pull_request.author_association == 'NONE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check contributor trust
        id: brin
        shell: bash
        run: |
          set -euo pipefail
          AUTHOR="${{ github.event.pull_request.user.login }}"
          if ! RESPONSE=$(curl -sSf --max-time 10 --retry 2 "https://api.brin.sh/contributor/${AUTHOR}" 2>/dev/null); then
            echo "verdict=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERDICT=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('verdict','unavailable'))" 2>/dev/null || echo "unavailable")
          case "$VERDICT" in
            safe|caution|suspicious|dangerous) ;;
            *) VERDICT="unavailable" ;;
          esac
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

      - name: Apply trust label
        if: |
          steps.brin.outputs.verdict == 'safe' ||
          steps.brin.outputs.verdict == 'caution' ||
          steps.brin.outputs.verdict == 'suspicious' ||
          steps.brin.outputs.verdict == 'dangerous'
        uses: actions/github-script@v9
        env:
          BRIN_VERDICT: ${{ steps.brin.outputs.verdict }}
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [`trust:${process.env.BRIN_VERDICT}`],
            });
