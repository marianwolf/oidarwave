name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release erstellen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python Version setzen
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Asset-Dateien abrufen
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          # Ein einziger find-Lauf statt drei Schleifen; node_modules/.venv/.git ausgeschlossen
          mapfile -t files < <(find . \
            \( -path ./node_modules -o -path ./.venv -o -path ./.git \) -prune -o \
            \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -type f -print | sort -u)
          if [ -f "manifest.json" ]; then files+=("manifest.json"); fi
          if [ -f "README.md" ]; then files+=("README.md"); fi
          assets="${files[*]}"
          echo "assets=$assets" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${files[@]}"

      - name: Release erstellen
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.assets.outputs.assets }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'gamma') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
