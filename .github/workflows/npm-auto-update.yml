name: npm auto update

on:
  schedule:
    # Montags 04:00 UTC (~05:00/06:00 Europe/Berlin)
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: npm-auto-update
  cancel-in-progress: false

jobs:
  npm-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: npm install && npm update
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm update --no-audit --no-fund
          # Hinweis: "npm upgrade" existiert nicht als npm-Befehl.
          # "npm update" bringt Dependencies im Semver-Rahmen auf den neuesten Stand.
          # Fuer Updates ueber den Semver-Rahmen hinaus (Major-Upgrades):
          # npx -y npm-check-updates -u && npm install --no-audit --no-fund
          git status --short

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create update PR
        if: steps.changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): weekly npm update"
          title: "chore(deps): weekly npm update"
          body: |
            Automatischer wöchentlicher Dependency-Update (`npm install && npm update`).

            - Erstellt: montags per Schedule, manuell via `workflow_dispatch` möglich
            - Auto-Merge: aktiviert (Squash, wartet auf erforderliche Checks)
          branch: chore/weekly-npm-update
          delete-branch: true
          labels: dependencies

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
