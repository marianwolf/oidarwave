<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NASA Livestreams auf Oidarwave"/>
    <meta name="keywords" content="NASA, Livestream, Weltraum, Oidarwave"/>
    <meta name="author" content="Marian Wolf"/>

    <meta property="og:title" content="Oidarwave - NASA Livestreams"/>
    <meta property="og:description" content="Verfolge NASA Livestreams direkt auf Oidarwave."/>
    <meta property="og:image" content="/favicon.svg"/>
    <meta property="og:url" content="/nasa/"/>
    <meta property="og:type" content="website">
    <meta property="og:locale" content="de_DE">

    <title>Oidarwave - NASA Livestreams</title>

    <link rel="canonical" href="/nasa/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">

    <link rel="dns-prefetch" href="https://profilbild.vercel.app">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" media="print" onload="this.media='all'">

    <script src="/src/js/mouse.js" defer></script>
    <script src="/src/js/cookie.js" defer></script>

    <style>
        .container {
            max-width: 1600px;
        }

        h2 {
            font-size: var(--font-size-lg, 1.25rem);
            margin-bottom: 0;
            text-align: center;
        }

        .footer {
            width: 100%;
        }

        .livestream-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-200, 16px);
            padding: var(--space-200, 16px) 0;
            width: 200%;
        }

        .livestream-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md, 12px);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        .player-wrapper .yt-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .livestream-card .card-title {
            padding: var(--space-100, 8px);
            font-size: var(--font-size-sm, 0.875rem);
            font-weight: var(--font-weight-medium, 500);
            text-align: center;
        }

        @media (max-width: 780px) {
            .livestream-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🎵 Oidarwave</div>
            <nav aria-label="Hauptnavigation">
                <a href="/">Radio</a>
                <a href="/video">Video</a>
                <a href="/nasa">NASA</a>
                <a href="mailto:marian.wolf2008@gmail.com">Kontakt</a>
                <a href="https://beta0.vercel.app" target="_blank">Beta</a>
            </nav>
        </header>
        <main>
            <section class="player-section">
                <div class="footer">
                    <h2>🚀 NASA Livestreams</h2>
                    <div class="livestream-grid">
                        <div class="livestream-card">
                            <div class="player-wrapper"><div id="player-0" class="yt-player"></div></div>
                            <div class="card-title">NASA Live</div>
                        </div>
                        <div class="livestream-card">
                            <div class="player-wrapper"><div id="player-1" class="yt-player"></div></div>
                            <div class="card-title">NASA ISS</div>
                        </div>
                        <div class="livestream-card">
                            <div class="player-wrapper"><div id="player-2" class="yt-player"></div></div>
                            <div class="card-title">NASA Media</div>
                        </div>
                        <div class="livestream-card">
                            <div class="player-wrapper"><div id="player-3" class="yt-player"></div></div>
                            <div class="card-title">NASA Science</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <p>2026 by<img src="https://profilbild.vercel.app/mw.svg" width="22" loading="lazy" style="vertical-align: middle; margin-left: 5px; margin-right: 5px;">| Alle Rechte vorbehalten. | <a href="/impressum" target="_blank">Impressum & Datenschutz</a></p>
        </footer>
    </div>
    <div class="cookie-banner" id="cookieBanner" role="dialog" aria-live="polite" aria-labelledby="cookieBannerHeading">
        <div class="cookie-banner-content">
            <p>
                Um die Website für Sie zu optimieren, nutzen wir anonyme Nutzungsstatistiken.
            </p>
            <div class="cookie-buttons">
                <button class="cookie-btn accept-btn" id="acceptCookies">Akzeptieren</button>
                <button class="cookie-btn decline-btn" id="declineCookies">Ablehnen</button>
            </div>
        </div>
    </div>

    <script>
        var videoIds = ['8c-GAkIzpGE', 'Tf_UjBMIzNo', 'm3kR2KK8TEs', '6RwfNBtepa4'];
        var players = [];

        function onYouTubeIframeAPIReady() {
            for (var i = 0; i < videoIds.length; i++) {
                players.push(new YT.Player('player-' + i, {
                    videoId: videoIds[i],
                    playerVars: {
                        autoplay: 0,
                        controls: 1,
                        rel: 0,
                        modestbranding: 1
                    },
                    events: {
                        onReady: onPlayerReady
                    }
                }));
            }
        }

        function onPlayerReady(event) {
            event.target.setPlaybackQuality('hd1080');
        }

        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    </script>
</body>
</html>
