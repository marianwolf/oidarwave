        /* Bestehendes Styling */
        .station-entry {

        .station-info {

        /* Layout für die Player Controls */
        .player-controls {

            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #1e1e1e;
            border-top: 2px solid #333;
        }
        
        .current-station-info {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }
        
        .meta-data {
            display: flex;
            flex-direction: column;
            margin-left: 5px;
        }

        /* Status Punkt */
        .status-dot {
            width: 15px;
            height: 15px;
            min-width: 15px; /* Sicherstellen, dass der Dot nicht schrumpft */
            border-radius: 50%;
            background-color: #555; /* Grau = Aus */
            transition: background-color 0.3s;
        }

        .status-dot.playing {
            background-color: #2ecc71; /* Grün = Läuft */
            box-shadow: 0 0 8px #2ecc71;
        }

        .status-dot.buffering {
            background-color: #f1c40f; /* Gelb = Lädt */
            animation: pulse 1s infinite;
        }
        
        /* Timer Styling */
        .timer-display {
            font-family: monospace;
            font-size: 1.2rem;
            color: #fff;
            background: #222;
            padding: 5px 10px;
            border-radius: 4px;
            margin: 0 15px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        /* Audio Player Styling für bessere Integration */
        #mainAudioPlayer {
            width: 250px; /* Begrenzte Breite für den Audio-Player */
        }
    </style>

    <!-- ZUSÄTZLICHES SCRIPT FÜR STATUS & TIMER LOGIK (ersetzt player.js nicht, sondern ergänzt es) -->
    <script>
        let starttime = null;
        let timerInterval = null;

        const audioPlayer = document.getElementById('mainAudioPlayer');
        const statusDot = document.getElementById('statusDot');
        const sessionTimer = document.getElementById('sessionTimer');
        const currentStationElement = document.getElementById('currentStation');
        const currentSongTitleElement = document.getElementById('currentSongTitle');
        const stationBtns = document.querySelectorAll('.station-btn');

        function startStation(url, name) {
            // 1. Reset UI (Entfernt "active" von allen Buttons)
            stationBtns.forEach(btn => btn.classList.remove('active'));
            
            // 2. Audio setzen und abspielen
            audioPlayer.src = url;
            audioPlayer.play();
            
            // 3. Status auf "Laden" setzen
            statusDot.className = 'status-dot buffering';
            currentStationElement.textContent = name;
            currentSongTitleElement.textContent = 'Wird geladen...';
            
            // 4. Den klickten Button als aktiv markieren
            document.querySelector(`.station-btn[data-url="${url}"]`).classList.add('active');

            // 5. Zeitmessung starten (aus der vorherigen Anfrage)
            starttime = Date.now();
            
            // Alten Timer löschen, falls einer läuft
            if (timerInterval) clearInterval(timerInterval);
            
            // Neuen Timer starten (jede Sekunde updaten)
            timerInterval = setInterval(updateTimer, 1000);
        }

        // Timer Funktion: Rechnet Millisekunden in HH:MM:SS um
        function updateTimer() {
            if (!starttime) return;
            
            const diff = Date.now() - starttime;
            const date = new Date(diff);

            // Formatierung HH:MM:SS
            const hours = String(date.getUTCHours()).padStart(2, '0');
            const minutes = String(date.getUTCMinutes()).padStart(2, '0');
            const seconds = String(date.getUTCSeconds()).padStart(2, '0');
            
            sessionTimer.textContent = `${hours}:${minutes}:${seconds}`;
        }

        // Event Listener für Audio-Status (Status-Dot-Logik)
        audioPlayer.addEventListener('playing', () => {
            statusDot.className = 'status-dot playing'; // Grün
            currentSongTitleElement.textContent = 'Live Stream läuft...'; // Standard-Titel, bis Metadaten geladen sind
        });

        audioPlayer.addEventListener('waiting', () => {
            statusDot.className = 'status-dot buffering'; // Gelb
            currentSongTitleElement.textContent = 'Verbinde/Lade Daten...';
        });

        audioPlayer.addEventListener('error', () => {
            statusDot.className = 'status-dot'; // Grau/Aus
            currentSongTitleElement.textContent = 'FEHLER beim Streamen!';
            if (timerInterval) clearInterval(timerInterval);
            sessionTimer.textContent = '00:00:00';
            starttime = null;
        });

        // Event Listener für Buttons (Startet den Stream und Timer)
        stationBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                startStation(
                    e.target.getAttribute('data-url'), 
                    e.target.getAttribute('data-name')
                );
            });
        });

        // Initialisierung bei Start (Status Dot auf Grau)
        document.addEventListener('DOMContentLoaded', () => {
             statusDot.className = 'status-dot';
        });

    </script>
