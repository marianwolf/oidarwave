<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oidarwave - Live Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --accent: #1db954;
            --accent-hover: #1ed760;
            --error: #e91429;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(90deg, #1db954, #1ed760);
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 10px;
        }

        .controls {
            text-align: center;
            margin-bottom: 30px;
        }

        .refresh-btn {
            background-color: var(--accent);
            color: black;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            background-color: var(--accent-hover);
            transform: scale(1.05);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
            border: 1px solid #333;
        }

        .card:hover {
            border-color: var(--accent);
        }

        .station-name {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-badge {
            font-size: 0.7rem;
            background-color: var(--error);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            opacity: 0; /* Hidden by default */
            animation: pulse 2s infinite;
        }

        .card.playing .live-badge {
            opacity: 1;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-height: 50px; /* Sicherstellen, dass die Karte nicht zusammenfällt */
        }

        .song-title {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .artist-name {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .meta-status {
            font-size: 0.8rem;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
            color: #555;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #555;
        }

        .status-dot.success { background-color: var(--accent); }
        .status-dot.error { background-color: var(--error); }
        .status-dot.loading { background-color: #ffd700; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        /* Spinner */
        .spinner {
            border: 2px solid rgba(255,255,255,0.1);
            border-left-color: var(--accent);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: none;
        }
        .loading .spinner { display: block; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>📻 Oidarwave Status</h1>
        <p>Aktuelle Titelinformationen aller Sender</p>
    </div>

    <div class="controls">
        <button class="refresh-btn" onclick="updateAllStations()">
            <span class="spinner" id="mainSpinner"></span>
            <span>Aktualisieren</span>
        </button>
    </div>

    <div class="grid" id="stationGrid">
        <!-- Karten werden hier per JS eingefügt -->
    </div>

    <script>
        // Konfiguration der Sender (basierend auf index.html)
        const stations = [
            {
                name: "Deutschlandfunk",
                metaUrl: "https://streamtext.dradio.de/dlf.txt",
                type: "text" // Deutschlandfunk (.txt)
            },
            {
                name: "Deutschlandfunk Nova",
                metaUrl: "https://static.deutschlandfunknova.de/actions/dradio/playlist/onair",
                type: "json_dlf_nova" // DLF Nova (JSON)
            },
            {
                name: "NDR 1 NDS",
                metaUrl: "https://www.ndr.de/public/radioplaylists/ndr1niedersachsen.json",
                type: "json_ndr" // NDR (JSON)
            },
            {
                name: "NDR 2",
                metaUrl: "https://www.ndr.de/public/radioplaylists/ndr2.json",
                type: "json_ndr" // NDR (JSON)
            },
            {
                name: "NDR Info",
                metaUrl: "https://www.ndr.de/epg/current/station-ndrinfo", 
                type: "html_ndr_info" // NDR (HTML/EPG)
            },
            {
                name: "NDR Kultur",
                metaUrl: "https://www.ndr.de/public/radioplaylists/ndrkultur.json",
                type: "json_ndr" // NDR (JSON)
            },
            {
                name: "N-JOY",
                metaUrl: "https://www.ndr.de/public/radioplaylists/njoy.json",
                type: "json_ndr" // NDR (JSON)
            },
            {
                name: "80s80s Digital",
                metaUrl: "https://iris-80s80s.loverad.io/flow.json?station=62",
                type: "json_80s" // 80s80s (JSON, verschachtelt)
            },
            {
                name: "90s90s",
                metaUrl: null, // Keine URL in index.html
                type: "none"
            },
            {
                name: "BBG Radio",
                metaUrl: null,
                type: "none"
            }
        ];

        // CORS Proxy um Browser-Blockaden zu umgehen (Wichtig, da viele URLs Cross-Origin sind)
        const CORS_PROXY = "https://corsproxy.io/?";

        const grid = document.getElementById('stationGrid');

        // Initialisiert die Kartenstruktur
        function initGrid() {
            grid.innerHTML = '';
            stations.forEach((station, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `station-${index}`;
                card.innerHTML = `
                    <div class="station-name">
                        ${station.name}
                        <span class="live-badge">LIVE</span>
                    </div>
                    <div class="track-info">
                        <div class="song-title" id="title-${index}">Lade...</div>
                        <div class="artist-name" id="artist-${index}"></div>
                    </div>
                    <div class="meta-status">
                        <span class="status-dot loading" id="dot-${index}"></span>
                        <span id="status-text-${index}">Warte auf Daten...</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Aktualisiert alle Senderdaten
        async function updateAllStations() {
            const btn = document.querySelector('.refresh-btn');
            const btnSpinner = document.getElementById('mainSpinner');
            btnSpinner.style.display = 'inline-block';
            btn.disabled = true;

            const promises = stations.map((station, index) => fetchStationData(station, index));
            await Promise.all(promises);

            btnSpinner.style.display = 'none';
            btn.disabled = false;
        }

        // Ruft die Metadaten für einen einzelnen Sender ab
        async function fetchStationData(station, index) {
            const cardEl = document.getElementById(`station-${index}`);
            const titleEl = document.getElementById(`title-${index}`);
            const artistEl = document.getElementById(`artist-${index}`);
            const dotEl = document.getElementById(`dot-${index}`);
            const statusTextEl = document.getElementById(`status-text-${index}`);

            titleEl.textContent = "Lade...";
            artistEl.textContent = "";
            dotEl.className = "status-dot loading";
            statusTextEl.textContent = "Lade Metadaten...";
            cardEl.classList.remove('playing');

            if (!station.metaUrl) {
                updateUI(index, "Keine Metadaten", "Sender liefert keine Infos.", "error");
                return;
            }

            try {
                // Verwende den Proxy, um CORS-Probleme zu umgehen
                const proxyUrl = CORS_PROXY + encodeURIComponent(station.metaUrl);
                const response = await fetch(proxyUrl);
                
                if (!response.ok) throw new Error(`HTTP-Fehler: ${response.status}`);

                let song = parseMetadata(station.type, station.name, response);

                // UI Update
                titleEl.textContent = decodeHTMLEntities(song.title);
                artistEl.textContent = decodeHTMLEntities(song.artist);
                
                dotEl.className = "status-dot success";
                statusTextEl.textContent = "Aktualisiert: " + new Date().toLocaleTimeString();
                
                // Aktiviere "Live" Badge visuell, wenn Daten gefunden wurden
                if (song.title !== "Unbekannt" && song.title !== "Format nicht erkannt") {
                    cardEl.classList.add('playing');
                }

            } catch (error) {
                console.error(`Fehler bei ${station.name}:`, error);
                updateUI(index, "Fehler beim Laden", "Verbindungs- oder Parsfehler.", "error");
            }
        }

        /**
         * Analysiert die Response basierend auf dem Sender-Typ.
         * Die Logik folgt der Logik, die in player.js erwartet wird.
         * @param {string} type - Der Typ des Metadaten-Formats (text, json_ndr, etc.)
         * @param {string} name - Der Name des Senders (für Debugging)
         * @param {Response} response - Die Fetch-Response
         * @returns {{title: string, artist: string}}
         */
        async function parseMetadata(type, name, response) {
            let song = { title: "Unbekannt", artist: "" };

            if (type === 'text') {
                const text = await response.text();
                // DLF (.txt) Format: "Artist - Title" oder nur "Title" in erster Zeile
                const firstLine = text.split('\n')[0].trim();
                const parts = firstLine.split(' - ');
                
                if (parts.length >= 2) {
                    song.artist = parts[0];
                    song.title = parts.slice(1).join(' - ');
                } else if (firstLine.length > 0) {
                    song.title = firstLine;
                } else {
                    song.title = "Keine aktuellen Daten";
                }

            } else if (type === 'json_ndr') {
                const data = await response.json();
                // NDR JSON (NDR 1, 2, Kultur, N-JOY)
                let currentTrack = null;

                if (Array.isArray(data) && data.length > 0) {
                    // NDR 1/Kultur: Oft das aktuellste Element im Hauptarray
                    currentTrack = data[0]; 
                } else if (data.songs && Array.isArray(data.songs) && data.songs.length > 0) {
                    // N-JOY: Liste der Songs
                    currentTrack = data.songs[0];
                }

                if (currentTrack) {
                    // Versuche Interpret/Artist und Titel/Title zu finden
                    song.title = currentTrack.title || currentTrack.Titel || "Unbekannt";
                    song.artist = currentTrack.artist || currentTrack.Interpret || "";
                } else {
                    song.title = "Format nicht erkannt (NDR)";
                }

            } else if (type === 'json_dlf_nova') {
                const data = await response.json();
                // Deutschlandfunk Nova (Array oder Object)
                if (Array.isArray(data) && data.length > 0) {
                    song.artist = data[0].artist || "";
                    song.title = data[0].title || "Unbekannt";
                } else {
                    song.title = "Keine aktuellen Daten";
                }

            } else if (type === 'json_80s') {
                const data = await response.json();
                // 80s80s (loverad.io - stark verschachtelt)
                try {
                    const track = data.result.entry[0].song.entry[0];
                    song.title = track.title || "Unbekannt";
                    song.artist = track.artist.entry[0].name || "";
                } catch (e) {
                    song.title = "Format nicht erkannt (80s80s)";
                }

            } else if (type === 'html_ndr_info') {
                const text = await response.text();
                // NDR Info (HTML/EPG - Regex ist hier die einzige Option)
                const titleMatch = text.match(/<span class="title">([^<]*)<\/span>/);
                const artistMatch = text.match(/<span class="artist">([^<]*)<\/span>/);
                
                if (titleMatch) song.title = titleMatch[1].trim();
                if (artistMatch) song.artist = artistMatch[1].trim();
                
                if (!titleMatch && !artistMatch) {
                    song.title = "Keine aktuellen EPG-Daten";
                }
            }

            return song;
        }

        // Aktualisiert das UI eines Senders mit den ermittelten Infos
        function updateUI(index, title, artist, status) {
            document.getElementById(`title-${index}`).textContent = title;
            document.getElementById(`artist-${index}`).textContent = artist;
            const dot = document.getElementById(`dot-${index}`);
            dot.className = `status-dot ${status}`;
            
            let statusText = "Aktualisiert";
            if (status === 'error') statusText = "Fehler";
            if (status === 'loading') statusText = "Lade...";
            
            document.getElementById(`status-text-${index}`).textContent = statusText;
            
            if (status !== 'playing') {
                 document.getElementById(`station-${index}`).classList.remove('playing');
            }
        }

        // Hilfsfunktion gegen HTML Entities in JSON (z.B. &amp;)
        function decodeHTMLEntities(text) {
            if (!text) return "";
            const textArea = document.createElement('textarea');
            textArea.innerHTML = text;
            return textArea.value;
        }

        // Start
        initGrid();
        updateAllStations();

        // Auto-Refresh alle 30 Sekunden
        setInterval(updateAllStations, 30000);

    </script>
</body>
</html>
