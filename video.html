<body>
    <div class="container">
        <header>
            <div class="logo">🎵 Oidarwave</div>
            <nav aria-label="Hauptnavigation">
                <a href="index.html">Radio</a>
                <a href="video.html">Video</a>
                <a href="mailto:marian.wolf2008@gmail.com">Kontakt</a>
                <a href="impressum.html">Impressum</a>
                <a href="https://beta0.vercel.app" target="_blank">Beta</a>
            </nav>
        </header>
        <main id="radio">
            <section class="player-section">
                <div class="station-selector">
                    <h2>🎥 Sender auswählen</h2>
                    <div class="station-grid">
                        <button class="station-btn" data-url="https://zdf-hls-15.akamaized.net/hls/live/2016498/de/veryhigh/master.m3u8" data-name="ZDF Livestream">
                            ZDF Livestream
                        </button>
                        <button class="station-btn" data-url="https://zdf-hls-15.akamaized.net/hls/live/2016498/de/veryhigh/master.m3u8" data-name="ZDF Livestream">
                            ZDF Livestream
                        </button>
                        <button class="station-btn" data-url="https://zdf-hls-15.akamaized.net/hls/live/2016498/de/veryhigh/master.m3u8" data-name="ZDF Livestream">
                            ZDF Livestream
                        </button>
                        <button class="station-btn" data-url="https://zdf-hls-15.akamaized.net/hls/live/2016498/de/veryhigh/master.m3u8" data-name="ZDF Livestream">
                            ZDF Livestream
                        </button>
                        <button class="station-btn" data-url="https://zdf-hls-15.akamaized.net/hls/live/2016498/de/veryhigh/master.m3u8" data-name="ZDF Livestream">
                            ZDF Livestream
                        </button>
                        <button class="station-btn" data-url="https://zdf-hls-15.akamaized.net/hls/live/2016498/de/veryhigh/master.m3u8" data-name="ZDF Livestream">
                            ZDF Livestream
                        </button>
                    </div>
                </div>
                <div class="player-controls">
                    <div class="current-station">
                        <span class="status-indicator" id="statusIndicator"></span>
                        <span id="currentStation">Sender auswählen</span>
                    </div>
                    <div class="video-container">
                        <video id="videoPlayer" controls preload="none" poster="/video-placeholder.png">
                            Ihr Browser unterstützt leider keine HTML5-Videowiedergabe.
                        </video>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <p>&copy; 2025 Oidarwave. Alle Rechte vorbehalten. | Webradio für jeden Geschmack</p>
        </footer>
    </div>
