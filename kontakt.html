<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Oidarwave ist dein Webradio für jeden Geschmack."/>
    <meta name="keywords" content="Webradio, Radio, Online-Radio, Oidarwave"/>
    <meta name="author" content="Marian Wolf"/>
    <meta property="og:title" content="Oidarwave - Webradio für jeden Geschmack"/>
    <meta property="og:description" content="Oidarwave ist dein Webradio mit einer großen Auswahl an Sendern."/>
    <meta property="og:image" content="/favicon.svg"/>
    <meta property="og:url" content="/"/>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" defer>
    <title>Oidarwave - Kontakt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-kontakt.css">
    <script src="mouse.js" defer></script>
    <script src="cookie.js" defer></script>
    <script src="player.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🎵 Oidarwave</div>
            <nav>
                <a href="index.html">Radio</a>
                <a href="kontakt.html">Kontakt</a>
                <a href="impressum.html">Impressum</a>
                <a href="https://beta0.vercel.app" target="_blank">Beta</a>
            </nav>
        </header>
        <main class="main-section">
            <h1>Kontaktieren Sie uns</h1>
            <p>Wir freuen uns auf Ihre Nachricht!</p>
            <form action="process_form.php" method="POST" novalidate aria-label="Kontaktformular">
                <fieldset>
                    <legend>Ihre Kontaktinformationen</legend>
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" placeholder="Max Mustermann" required autocomplete="name" aria-label="Ihr Name">
                    </div>
                    <div class="form-group">
                        <label for="email">E-Mail:</label>
                        <input type="email" id="email" name="email" placeholder="max.mustermann@example.de" required autocomplete="email" aria-label="Ihre E-Mail-Adresse">
                    </div>
                    <div class="form-group">
                        <label for="message">Nachricht:</label>
                        <textarea id="message" name="message" rows="5" placeholder="Ihre Nachricht an uns..." required autocomplete="off" aria-label="Ihre Nachricht"></textarea>
                    </div>
                </fieldset>
                <button type="submit" class="submit-btn">Nachricht senden</button>
            </form>
        </main>
    </div>
</body>
</html>
